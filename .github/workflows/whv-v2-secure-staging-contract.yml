name: WHV V2 - secure staging contract and restore proof

on:
  pull_request:
    branches: [v2]
    paths:
      - 'worldhealth-vision-v2/infra/**'
      - 'worldhealth-vision-v2/services/*/Dockerfile'
      - '.github/workflows/whv-v2-secure-staging-contract.yml'
  push:
    branches:
      - 'security/v2-secure-staging-*'
    paths:
      - 'worldhealth-vision-v2/infra/**'
      - 'worldhealth-vision-v2/services/*/Dockerfile'
      - '.github/workflows/whv-v2-secure-staging-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: whv-secure-staging-${{ github.ref }}
  cancel-in-progress: true

# CI-only values. Never copy the sample image tag or issuer into a public release.
env:
  WHV_TIMESCALE_IMAGE: timescale/timescaledb:2.15.3-pg16
  WHV_OIDC_ISSUER_URI: https://ci-only.invalid/realms/worldvision
  WHV_DB_PASSWORD_FILE: ${{ runner.temp }}/whv_db_password
  WHV_BACKUP_DIR: ${{ runner.temp }}/whv_backups

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Create throwaway CI secret
        run: |
          openssl rand -hex 36 > "$WHV_DB_PASSWORD_FILE"
          chmod 0600 "$WHV_DB_PASSWORD_FILE"
      - name: Parse and validate resolved secure staging Compose
        run: |
          docker compose version
          python3 -m py_compile worldhealth-vision-v2/infra/tests/verify_secure_staging.py
          bash -n worldhealth-vision-v2/infra/ops/backup-db.sh
          bash -n worldhealth-vision-v2/infra/ops/restore-drill.sh
          docker compose -f worldhealth-vision-v2/infra/compose.secure-staging.yml config --format json > "$RUNNER_TEMP/whv-secure-config.json"
          python3 worldhealth-vision-v2/infra/tests/verify_secure_staging.py "$RUNNER_TEMP/whv-secure-config.json"
      - name: Fail closed when critical variables are absent
        run: |
          set -eu
          for name in WHV_DB_PASSWORD_FILE WHV_OIDC_ISSUER_URI WHV_TIMESCALE_IMAGE; do
            if env -u "$name" docker compose -f worldhealth-vision-v2/infra/compose.secure-staging.yml config --quiet >/dev/null 2>&1; then
              echo "FAILED: $name is not mandatory" >&2
              exit 1
            fi
          done
          echo "PASS: all three required settings fail closed"
      - name: Verify local DEV stack cannot publish ports on LAN interfaces
        run: |
          docker compose -f worldhealth-vision-v2/infra/docker-compose.yml config --format json > "$RUNNER_TEMP/whv-dev-config.json"
          python3 - "$RUNNER_TEMP/whv-dev-config.json" <<'PY'
          import json, sys
          services = json.load(open(sys.argv[1]))['services']
          ports = [(name, p) for name, service in services.items() for p in service.get('ports', [])]
          assert len(ports) >= 8, ports
          for name, port in ports:
              assert port.get('host_ip') == '127.0.0.1', (name, port)
          print(f'PASS: {len(ports)} local-only dev TCP port mappings')
          PY

  backup-restore:
    runs-on: ubuntu-latest
    needs: contract
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Prepare ephemeral database password and backup directory
        run: |
          openssl rand -hex 36 > "$WHV_DB_PASSWORD_FILE"
          chmod 0644 "$WHV_DB_PASSWORD_FILE"
          mkdir -p "$WHV_BACKUP_DIR"
          chmod 0700 "$WHV_BACKUP_DIR"
      - name: Launch ONLY private TimescaleDB (no public ingress)
        run: |
          docker compose -f worldhealth-vision-v2/infra/compose.secure-staging.yml up -d --wait whv-timescaledb
      - name: Seed a marker of known value
        run: |
          docker compose -f worldhealth-vision-v2/infra/compose.secure-staging.yml exec -T whv-timescaledb sh -eu -c '
            export PGPASSWORD="$(cat "$POSTGRES_PASSWORD_FILE")"
            psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "
              CREATE TABLE public.whv_backup_canary(id integer primary key);
              INSERT INTO public.whv_backup_canary(id) VALUES (1);
            "
          '
      - name: Create, checksum, independently restore and verify logical backup
        run: |
          bash worldhealth-vision-v2/infra/ops/backup-db.sh
          backup_file="$(find "$WHV_BACKUP_DIR" -maxdepth 1 -name '*.dump' -type f -print -quit)"
          test -n "$backup_file"
          bash worldhealth-vision-v2/infra/ops/restore-drill.sh "$backup_file" whv_backup_canary
      - name: Keep original database intact after recovery test
        run: |
          docker compose -f worldhealth-vision-v2/infra/compose.secure-staging.yml exec -T whv-timescaledb sh -eu -c '
            export PGPASSWORD="$(cat "$POSTGRES_PASSWORD_FILE")"
            psql -v ON_ERROR_STOP=1 -At -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
              -c "SELECT count(*) FROM public.whv_backup_canary" | grep -qx 1
          '
          echo "PASS: original and restore were independent"
      - name: Delete all ephemeral CI data
        if: always()
        run: |
          docker compose -f worldhealth-vision-v2/infra/compose.secure-staging.yml down --volumes --remove-orphans || true
          rm -rf "$WHV_BACKUP_DIR" "$WHV_DB_PASSWORD_FILE"

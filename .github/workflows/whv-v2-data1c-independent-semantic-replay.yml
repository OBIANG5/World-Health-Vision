name: World-Vision DATA-1C-A2B2a — independent provider semantic replay

on:
  push:
    branches:
      - 'data/v2-independent-semantic-replay-*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: whv-a2b2a-${{ github.ref }}
  cancel-in-progress: true

jobs:
  private-semantic-replay-py312:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: worldhealth-vision-v2/services/ingestion-service/pyproject.toml
      - name: Reuse actual ingestion package and ephemeral test-only signature tools
        working-directory: worldhealth-vision-v2/services/ingestion-service
        run: |
          python -m pip install --disable-pip-version-check -e '.[dev]'
          python -m pip install --disable-pip-version-check 'cryptography>=43,<47'
          python -m compileall -q src/ingestion_service
      - name: Reject perfectly checksum-consistent but semantically wrong normalized observations
        working-directory: worldhealth-vision-v2/services/ingestion-service
        run: python -m pytest -q tests/test_semantic_source_replay.py tests/test_private_bronze_witness.py
      - name: Run all ingestion regressions excluding the separate external World Bank live test
        working-directory: worldhealth-vision-v2/services/ingestion-service
        run: python -m pytest -q tests --ignore=tests/test_worldbank_live_scope.py
      - name: Verify independent validation does not import first source parser or permit publishing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("worldhealth-vision-v2/services/ingestion-service/src/ingestion_service")
          ref=(p/"semantic_source_replay.py").read_text()
          witness=(p/"private_bronze_witness.py").read_text()
          assert "parse_ibge_national_population" not in ref.replace("# or IbgeNationalCensusPilot, so it can catch pipeline changes.", "")
          assert "parse_wdi_brazil_2022_population" not in ref
          assert "verify_original_to_normalized(" in witness
          assert "PRIVATE_RESEARCH_VALIDATION" in witness
          assert '"PUBLIC_API_INGEST"' not in witness
          print("PASS: reference semantic verification independent of original parser, research-only")
          PY

name: World-Vision DATA-1C-A2B2b — Ed25519 V2 parser identity bound to source proof

on:
  push:
    branches:
      - 'data/v2-semantic-parser-attestation-*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: whv-data1c-parser-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java-postgres-signed-parser-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: worldhealth-vision-v2/pom.xml
      - name: Validate V2 parser version, externally pinned SHA and independently signed evidence
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path('worldhealth-vision-v2/services/timeseries-service/src/main/java/com/worldhealthvision/timeseries/service')
          signed=(root/'SignedEvidenceAttestation.java').read_text()
          verifier=(root/'EvidenceAttestationVerifier.java').read_text()
          assert 'WORLD_VISION_BRONZE_WITNESS_V2' in signed
          assert 'semanticVerifierVersion' in signed and 'semanticVerifierCodeSha256' in signed
          assert 'WORLD_VISION_SEMANTIC_POPULATION_REPLAY_V1' in verifier
          assert 'trustedSemanticCodeSha256' in verifier
          assert 'SEMANTIC_VERSION.equals' in verifier
          assert 'trustedSemanticCodeSha256.equals' in verifier
          main=(root.parent.parent/'resources/application.yml').read_text()
          assert 'WHV_SEMANTIC_REPLAY_CODE_SHA256' in main
          assert 'PUBLIC_API_INGEST' in verifier
          print('PASS V2 proof requires signed independent parser version and pin')
          PY
      - name: Real PostgreSQL16 Flyway and all Java service integration regressions
        working-directory: worldhealth-vision-v2
        run: mvn -B -ntp -pl services/timeseries-service -am test
      - name: No private signer/reviewer key committed or shared with public service
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('worldhealth-vision-v2/services/timeseries-service/src/main')
          contents='\n'.join(f.read_text() for f in p.rglob('*') if f.is_file())
          assert 'BEGIN PRIVATE KEY' not in contents
          assert 'initSign(' not in contents
          assert 'integration-test-only-not-secret' not in contents
          print('PASS only public Ed25519 anchors and no hardcoded private/test keys')
          PY

  python-private-semantic-witness-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: worldhealth-vision-v2/services/ingestion-service/pyproject.toml
      - name: Reuse source ingestion environment and test-only cryptography
        working-directory: worldhealth-vision-v2/services/ingestion-service
        run: |
          python -m pip install --disable-pip-version-check -e '.[dev]'
          python -m pip install --disable-pip-version-check 'cryptography>=43,<47'
          python -m compileall -q src/ingestion_service
      - name: Independent raw semantic replay, Ed25519 V2 signed parser hash and adversarial cases
        working-directory: worldhealth-vision-v2/services/ingestion-service
        run: python -m pytest -q tests/test_semantic_source_replay.py tests/test_private_bronze_witness.py
      - name: Full ingestion regressions excluding separate World Bank live network test
        working-directory: worldhealth-vision-v2/services/ingestion-service
        run: python -m pytest -q tests --ignore=tests/test_worldbank_live_scope.py

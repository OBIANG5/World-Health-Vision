name: World-Vision Media Studio real-UI mobile preview

on:
  push:
    branches:
      - 'improve/media-studio-mobile-preview-2026-11-12'
      - 'feature/world-vision-media-studio'
    paths:
      - '.github/workflows/whv-media-studio-mobile-preview.yml'
      - 'worldhealth-vision-v2/frontend/web-v2/**'
      - 'worldhealth-vision-v2/scripts/media-preview-bootstrap.js'
      - 'worldhealth-vision-v2/scripts/build-media-preview.mjs'
  workflow_dispatch:

concurrency:
  group: world-vision-media-mobile-preview
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout actual V2 Media Studio source
        uses: actions/checkout@v4
      - name: Install Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: worldhealth-vision-v2/frontend/web-v2/package-lock.json
      - name: Install canonical React frontend dependencies
        working-directory: worldhealth-vision-v2/frontend/web-v2
        run: npm ci --no-audit --no-fund
      - name: Typecheck and compile original V2 React Media Studio
        working-directory: worldhealth-vision-v2/frontend/web-v2
        env:
          VITE_WHV_PREVIEW_MODE: 'true'
        run: npm run build -- --base=./
      - name: Add explicitly labelled fictional preview adapter
        run: |
          node --check worldhealth-vision-v2/scripts/media-preview-bootstrap.js
          node worldhealth-vision-v2/scripts/build-media-preview.mjs
      - name: Install browser smoke-test dependency
        working-directory: worldhealth-vision-v2/frontend/web-v2
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund playwright
          npx playwright install chromium
      - name: Verify the real Media Studio on iPhone and desktop
        working-directory: worldhealth-vision-v2/frontend/web-v2
        run: node media-preview-smoke.mjs
      - name: Verify public artifact is transparently labelled and independent
        run: |
          test -s worldhealth-vision-v2/frontend/web-v2/dist/index.html
          test -s worldhealth-vision-v2/frontend/web-v2/dist/media-preview-bootstrap.js
          test -s worldhealth-vision-v2/frontend/web-v2/dist/media-studio-iphone.png
          test -s worldhealth-vision-v2/frontend/web-v2/dist/media-studio-desktop.png
          grep -q 'media-preview-bootstrap.js' worldhealth-vision-v2/frontend/web-v2/dist/index.html
      - name: Update SAME Media Studio preview branch without rewriting its history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Preserve the existing branch and its permanent preview URL.
          git clone --quiet --depth 1 --single-branch \
            --branch whv-media-studio-browser-preview \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            /tmp/whv-media-studio-preview
          # Refresh only the static build; never touch canonical V2 or media code.
          find /tmp/whv-media-studio-preview \
            -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a worldhealth-vision-v2/frontend/web-v2/dist/. /tmp/whv-media-studio-preview/
          cat > /tmp/whv-media-studio-preview/preview-deployment.json <<EOF
          {
            "source_branch": "feature/world-vision-media-studio",
            "source_commit": "${GITHUB_SHA}",
            "preview_type": "STATIC_EXPLICIT_DEMO",
            "backend_connected": false,
            "generated_media_proof": false
          }
          EOF
          cd /tmp/whv-media-studio-preview
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No static preview changes"
          else
            git commit -m "preview(media): update real UI from ${GITHUB_SHA::12}"
            git push origin HEAD:whv-media-studio-browser-preview
          fi
          echo "Stable preview: https://raw.githack.com/${GITHUB_REPOSITORY}/whv-media-studio-browser-preview/index.html?view=media"

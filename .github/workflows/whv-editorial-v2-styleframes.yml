name: World-Vision Editorial V2 — 9 genuine scene audit frames

on:
  workflow_dispatch:
  push:
    branches: [rebuild/editorial-v2-quality-gates]
    paths:
      - 'worldhealth-vision-v2/services/media-renderer/src/WorldVisionEditorialV2.tsx'
      - 'worldhealth-vision-v2/services/media-renderer/quality/quality_gate_v2.py'
      - 'worldhealth-vision-v2/services/media-renderer/render-editorial-v2-stills.mjs'
      - 'worldhealth-vision-v2/services/media-renderer/src/WorldVisionEditorialV2.tsx'
      - 'worldhealth-vision-v2/services/media-renderer/scripts/setup_editorial_v2_assets.sh'
      - '.github/workflows/whv-editorial-v2-styleframes.yml'

permissions:
  contents: write

concurrency:
  group: worldvision-v2-full-scene-stills
  cancel-in-progress: true

jobs:
  styleframes:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout exact rebuild
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Node 22 for Remotion
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install existing Remotion
        working-directory: worldhealth-vision-v2/services/media-renderer
        run: npm install --no-audit --no-fund
      - name: Install FFmpeg for full-size to phone-size image QA
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
      - name: Verify approved sources, fonts and new quality gate
        shell: bash
        run: |
          set -euo pipefail
          python3 worldhealth-vision-v2/services/media-renderer/quality/quality_gate_v2.py --mode source
          bash worldhealth-vision-v2/services/media-renderer/scripts/setup_editorial_v2_assets.sh
      - name: Render actual 9 storyboard frames in full vertical resolution
        working-directory: worldhealth-vision-v2/services/media-renderer
        env:
          REMOTION_DISABLE_UPDATE_CHECK: '1'
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck
          node --check render-editorial-v2-stills.mjs
          node render-editorial-v2-stills.mjs
      - name: Generate real compressed contact-sheet proofs for small mobile screens
        shell: bash
        run: |
          set -euo pipefail
          D=worldhealth-vision-v2/services/media-renderer/output/editorial-v2/still-audit
          for f in "$D"/*.png; do
            stem="$(basename "$f" .png)"
            ffmpeg -y -v error -i "$f" -frames:v 1 -vf scale=540:960 -q:v 3 "$D/$stem-review.jpg"
          done
          ffmpeg -y -v error             -i "$D/newstart-archive-review.jpg" -i "$D/china-review.jpg" -i "$D/iran-ukraine-review.jpg"             -filter_complex hstack=inputs=3 -q:v 3 "$D/inner-scenes-contact-sheet.jpg"
          ffmpeg -y -v error             -i "$D/newstart-expiry-review.jpg" -i "$D/uncertainty-review.jpg" -i "$D/silent-signature-review.jpg"             -filter_complex hstack=inputs=3 -q:v 3 "$D/last-scenes-contact-sheet.jpg"
      - name: Preserve QA frames for user visual review
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Shared preview is simultaneously updated by independent render jobs.
          # Rebuild the commit on the latest remote tree; never force-push or
          # discard parallel media assets.
          git clone --quiet --depth 1 --branch whv-media-studio-browser-preview \
            "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" /tmp/wv-v2-stills
          SRC="$GITHUB_WORKSPACE/worldhealth-vision-v2/services/media-renderer/output/editorial-v2/still-audit"
          cd /tmp/wv-v2-stills
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          success=0
          for attempt in 1 2 3 4 5 6; do
            git fetch --quiet --depth 1 origin whv-media-studio-browser-preview
            git reset --hard FETCH_HEAD
            OUT=media-lab/summit-2026/editorial-v2/still-audit
            mkdir -p "$OUT"
            cp "$SRC/"*.png "$SRC/"*.jpg "$SRC/scene-audit.json" "$OUT/"
            git add "$OUT"
            if git diff --cached --quiet; then success=1; break; fi
            git commit -m "review(media-v2): nine original Remotion styleframes with phone-size image proofs"
            if git push origin HEAD:whv-media-studio-browser-preview; then success=1; break; fi
            echo "Preview branch advanced; retrying safely ($attempt)"
            sleep "$attempt"
          done
          test "$success" = 1

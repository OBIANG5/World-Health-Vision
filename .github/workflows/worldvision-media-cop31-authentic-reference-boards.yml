name: World-Vision MEDIA — COP31 original source and mobile director boards (NO VOICE)
on:
  push:
    branches:
      - feature/worldvision-media-cop31-primary-evidence-director-lock-2026-11-21
    paths:
      - worldhealth-vision-v2/media-pilots/cop31-negotiations/**
      - .github/workflows/worldvision-media-cop31-authentic-reference-boards.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cop31-source-boards-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-audit-and-director-boards:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install image/document processing libraries (no TTS, no paid API)
        run: |
          python -m pip install --disable-pip-version-check "pillow==12.0.0" "PyMuPDF==1.26.5" "requests==2.32.5"
          test -s /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf
      - name: Fetch verified URLs, hash actual bytes, build internal 1080x1920 frames and 390px evidence
        run: |
          set -euo pipefail
          python worldhealth-vision-v2/media-pilots/cop31-negotiations/build-reference-boards.py /tmp/cop31-reference
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path('/tmp/cop31-reference/audit.json')
          d=json.loads(p.read_text())
          assert len(d['assets'])==3 and len(d['documents'])==2
          assert len(d['frames'])==3
          assert not d['individual_rights_cleared'] and not d['public_video_generated']
          assert not d['draft_script_approved'] and not d['vivienne_c52_recorded']
          assert all(x['use']=='PREVIEW_ONLY_NOT_MASTER' for x in d['assets'])
          assert all(x['status']=='official_draft_not_adopted' for x in d['documents'])
          print('PASS: authentic documentary drafts; 3 EU official reference previews; 390px images only; NO OWNER VOICE')
          PY
      - name: Inspect TWO official EU photo detail pages for public originals (NO guessed URL or login)
        run: |
          set -euo pipefail
          python worldhealth-vision-v2/media-pilots/cop31-negotiations/discover-eu-originals.py /tmp/cop31-reference
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('/tmp/cop31-reference/eu-photo-originals-discovery.json').read_text())
          assert len(d['files']) == 2
          assert not d['new_vivienne_c52_take_recorded']
          assert not d['public_master_created'] and not d['publication_approved']
          for item in d['files']:
              print(item['eu_photo_ref'],item['status'])
              assert item['full_resolution_production_master_cleared'] is False
          PY
      - name: Archive verified previews and honest rights gate for human quality review
        uses: actions/upload-artifact@v4
        with:
          name: worldvision-media-cop31-primary-evidence-static-review-NOT-PUBLIC
          path: |
            /tmp/cop31-reference/audit.json
            /tmp/cop31-reference/eu-photo-originals-discovery.json
            /tmp/cop31-reference/direction-a-hook-1080x1920.png
            /tmp/cop31-reference/direction-b-negotiation-1080x1920.png
            /tmp/cop31-reference/contact-sheet-390px.png
          retention-days: 3
          if-no-files-found: error

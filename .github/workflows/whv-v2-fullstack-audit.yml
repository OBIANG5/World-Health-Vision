name: WHV V2 canonical full-stack integration audit

on:
  push:
    branches:
      - 'audit/whv-v2-integral-2026-11-10'
      - 'v2'
      - 'improve/v2-*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: worldhealth-vision-v2/pom.xml
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: worldhealth-vision-v2/frontend/web-v2/package-lock.json
      - name: Confirm no older V0/V1 code enters active build
        run: |
          test -f worldhealth-vision-v2/pom.xml
          test -d worldhealth-vision-v2/frontend/web-v2
          test -d worldhealth-vision-v2/services
      - name: Java 21 canonical V2 modules
        working-directory: worldhealth-vision-v2
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp test
          ./mvnw -B -ntp -DskipTests package
      - name: Inspect and syntax-check every canonical V2 Python module
        run: |
          python -m compileall -q worldhealth-vision-v2/services/analytics-service/src
          python -m compileall -q worldhealth-vision-v2/services/ingestion-service/src
          python - <<'PY'
          from pathlib import Path
          root = Path('worldhealth-vision-v2')
          source_files = [
              p for p in root.rglob('*')
              if p.is_file()
              and not any(part in {'node_modules','target','__pycache__','dist','.git','.m2'} for part in p.parts)
              and p.suffix.lower() in {'.py','.java','.ts','.tsx','.js','.mjs','.sql','.yml','.yaml','.json','.md','.css'}
          ]
          print('Canonical V2 source/config/documentation files inventoried:',len(source_files))
          assert len(source_files) >= 200
          assert all(str(p).startswith('worldhealth-vision-v2/') for p in source_files)
          PY
      - name: Python 3.12 V2 analytics unit tests
        run: |
          pip install -e './worldhealth-vision-v2/services/analytics-service[dev]'
          python -m pytest -q worldhealth-vision-v2/services/analytics-service/tests
      - name: Python 3.12 V2 ingestion unit tests
        run: |
          pip install -e './worldhealth-vision-v2/services/ingestion-service[dev]'
          python -m pytest -q worldhealth-vision-v2/services/ingestion-service/tests
      - name: Install exact frontend V2
        working-directory: worldhealth-vision-v2/frontend/web-v2
        run: npm ci --no-audit --no-fund
      - name: TypeScript build validation
        working-directory: worldhealth-vision-v2/frontend/web-v2
        run: npx tsc -b --pretty false
      - name: Generate original frontend V2 production assets
        working-directory: worldhealth-vision-v2/frontend/web-v2
        run: npx vite build --base=/

  docker-core:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Docker/Compose availability
        run: |
          docker version
          docker compose version
      - name: Start ONLY the canonical V2 core backend
        run: |
          docker compose -f worldhealth-vision-v2/infra/docker-compose.yml up --build -d             gateway-service catalog-service timeseries-service analytics-service ingestion-service
      - name: Check live health and query paths
        run: |
          set -eu
          for i in $(seq 1 80); do
            if curl --max-time 3 -fsS http://localhost:8080/actuator/health >/tmp/whv-health.json; then break; fi
            sleep 5
          done
          echo "Gateway health:"; cat /tmp/whv-health.json
          curl -fsS --max-time 12 'http://localhost:8080/api/catalog/countries?limit=3' >/tmp/whv-countries.json
          python3 - <<'PY'
          import json
          v=json.load(open('/tmp/whv-countries.json'))
          assert isinstance(v,dict) and 'items' in v
          print('Catalog countries',len(v['items']))
          PY
          echo "Validate full multi-source registry and non-empty geographic region catalogue:"
          curl -fsS --max-time 12 http://localhost:8080/api/catalog/sources >/tmp/whv-sources.json
          curl -fsS --max-time 12 http://localhost:8080/api/catalog/regions >/tmp/whv-regions.json
          python3 - <<'PY'
          import json
          sources = json.load(open('/tmp/whv-sources.json'))['items']
          regions = json.load(open('/tmp/whv-regions.json'))['items']
          codes = {source['code'] for source in sources}
          assert len(codes) >= 22, f"Missing V2 registered sources: only {len(codes)}"
          assert {'WORLD_BANK','IMF','OECD','NUMBEO','OSM','WHO_GHO','AFDB'} <= codes
          member_regions = [region for region in regions if region['countryCount'] > 0]
          assert len(member_regions) >= 6, "Region catalog lacks real member countries"
          print('Sources registered', len(codes), 'Regions with members', len(member_regions))
          PY
          echo "Database indicator catalog check:"
          docker compose -f worldhealth-vision-v2/infra/docker-compose.yml exec -T whv-timescaledb \
            psql -U whv_user -d whv -Atc "select code from catalog.indicator where code like 'SH.XPD.%' order by code" || true
          echo "HTTP catalog indicator check:"
          curl -fsS -o /tmp/whv-indicator.json -w 'HTTP %{http_code}\\n' --max-time 10 \
            http://localhost:8080/api/catalog/indicators/SH.XPD.CHEX.GD.ZS
          head -c 300 /tmp/whv-indicator.json
          echo
          echo "Check ingestion service without firing any costly external jobs:"
          docker compose -f worldhealth-vision-v2/infra/docker-compose.yml exec -T ingestion-service             python -c "import urllib.request; print(urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=15).read().decode()[:600])"
          echo "Waiting until the actual time-series service is ready:"
          ready=0
          for n in $(seq 1 40); do
            code=$(curl -sS --max-time 4 -o /tmp/ts-readiness.json -w '%{http_code}'               http://localhost:8080/api/timeseries/readiness || true)
            if [ "$code" = "200" ]; then ready=1; break; fi
            sleep 3
          done
          if [ "$ready" -ne 1 ]; then echo "Timeseries readiness failure"; cat /tmp/ts-readiness.json || true; exit 1; fi
          head -c 500 /tmp/ts-readiness.json
          echo
          echo "Verify country-local official source and independent local reporting layers:"
          curl -fsS --max-time 20 http://localhost:8080/api/catalog/countries/GAB/local-context > /tmp/whv-gabon-local-context.json
          curl -fsS --max-time 20 http://localhost:8080/api/catalog/countries/FRA/local-context > /tmp/whv-france-local-context.json
          python3 - <<'PY'
          import json
          gab = json.load(open('/tmp/whv-gabon-local-context.json'))
          fra = json.load(open('/tmp/whv-france-local-context.json'))
          assert gab['countryIso3'] == 'GAB'
          assert gab['localSourceCount'] == 3
          sources = {s['sourceCode']: s for s in gab['localSources']}
          assert sources['INSTAT_GABON']['sourceType'] == 'NATIONAL_OFFICIAL'
          assert sources['AGP_GABON']['sourceType'] == 'LOCAL_MEDIA'
          assert sources['BEAC_CEMAC']['sourceType'] == 'REGIONAL_OFFICIAL'
          assert sources['BEAC_CEMAC']['geographicScopeKind'] == 'REGIONAL_SHARED'
          assert all(s['connectionState'] == 'CATALOG_ONLY' for s in gab['localSources'])
          assert gab['documentedReleaseCount'] == 1
          census = gab['documentedReleases'][0]
          assert census['indicatorCode'] == 'SP.POP.TOTL'
          assert census['referenceYear'] == 2026
          assert float(census['valueNumeric']) == 3518621
          assert census['populationScope'] == 'ALL_RESIDENTS'
          assert census['publicationStatus'] == 'PRELIMINARY_HOMOLOGATED'
          assert census['verificationStatus'] == 'DOCUMENTED_NOT_INGESTED'
          assert fra['localSourceCount'] == 2
          assert {s['sourceCode'] for s in fra['localSources']} == {'INSEE_FRANCE', 'BANQUE_DE_FRANCE'}
          assert fra['documentedReleaseCount'] == 0
          print('Gabon, France and regional shared BEAC organization scope verified; no source falsely connected')
          PY
          echo "World-wide country-specific source coverage must reveal missing research:"
          curl -fsS --max-time 20 \
            'http://localhost:8080/api/catalog/local-sources/coverage?limit=500' \
            > /tmp/whv-national-source-coverage.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/whv-national-source-coverage.json'))
          assert d['totalCountryCount'] >= 200, d
          assert d['countriesWithCountrySpecificSources'] == 4, d
          assert d['countriesWithRegionalReferencesOnly'] == 5, d
          assert d['verifiedIngestionLinks'] == 0, d
          assert d['countriesNotResearchedLocally'] > 190, d
          by_code={c['countryIso3']:c for c in d['items']}
          assert by_code['GAB']['researchStatus'] == 'PARTIAL_CATALOGUED', by_code['GAB']
          assert by_code['CMR']['researchStatus'] == 'REGIONAL_REFERENCE_ONLY', by_code['CMR']
          assert by_code['JPN']['researchStatus'] == 'NOT_RESEARCHED', by_code['JPN']
          assert by_code['USA']['nationalOfficialCount'] == 2
          assert by_code['NGA']['nationalOfficialCount'] == 2
          print('Country-source research gap measured from real catalogue: ', d['totalCountryCount'],
                'country-specific partial:',d['countriesWithCountrySpecificSources'],
                'regional only:',d['countriesWithRegionalReferencesOnly'],
                'automated:', d['verifiedIngestionLinks'])
          PY
          echo "Prove national publications are compared ONLY with actually stored international observations:"
          curl -fsS --max-time 20 \
            http://localhost:8080/api/product/countries/GAB/national-comparisons \
            >/tmp/whv-gab-national-comparisons.json
          curl -fsS --max-time 20 \
            http://localhost:8080/api/product/countries/FRA/national-comparisons \
            >/tmp/whv-fra-national-comparisons.json
          python3 - <<'PY'
          import json
          gab=json.load(open('/tmp/whv-gab-national-comparisons.json'))
          fra=json.load(open('/tmp/whv-fra-national-comparisons.json'))
          assert gab['countryIso3'] == 'GAB', gab
          assert gab['comparisonCount'] == 1, gab
          evidence=gab['comparisons'][0]
          assert evidence['releaseCode'] == 'GAB-RGPL-2026-RESIDENTS'
          assert evidence['localReferenceYear'] == 2026
          assert evidence['status'] == 'NO_INTERNATIONAL_OBSERVATIONS'
          assert evidence['internationalLatest'] == []
          assert evidence['numericalDifference'] is None
          assert evidence['comparableByMethod'] is False
          assert fra['countryIso3'] == 'FRA'
          assert fra['comparisonCount'] == 0
          print('Live gateway national comparisons truthful: no Timescale series means no invented WB/IMF numbers.')
          PY
          echo "Verify catalogue registration is not confused with real observations:"
          curl -fsS --max-time 20 http://localhost:8080/api/timeseries/sources/coverage > /tmp/whv-source-coverage.json
          python3 - <<'PY'
          import json
          registered = json.load(open('/tmp/whv-sources.json'))['items']
          coverage = json.load(open('/tmp/whv-source-coverage.json'))['items']
          by_code = {item['sourceCode']: item for item in coverage}
          assert len(coverage) == len(registered), (len(coverage), len(registered))
          assert {s['code'] for s in registered} == set(by_code)
          for code, item in by_code.items():
              assert item['observedRecordCount'] == 0, (code, item)
              assert item['estimatedRecordCount'] == 0, (code, item)
              assert item['coveredCountryCount'] == 0, (code, item)
              assert item['latestAvailablePeriodStart'] is None
          print('V2 source registry and zero-observation evidence verified for', len(coverage), 'sources')
          PY
          echo "Validate all five real application containers are running without a startup crash:"
          for name in whv-gateway whv-catalog whv-timeseries whv-analytics whv-ingestion; do
            running=$(docker inspect --format '{{.State.Running}}' "$name")
            restarts=$(docker inspect --format '{{.RestartCount}}' "$name")
            echo "$name running=$running restartCount=$restarts"
            test "$running" = "true"
            test "$restarts" = "0"
          done
          echo "Check real advisor POST route and forbid fabricated answers in empty database:"
          curl -fsS --max-time 30 -H 'Content-Type: application/json' \
            -d '{"question":"Quelle est la croissance française ?","iso3":"FRA","lang":"fr"}' \
            http://localhost:8080/api/analytics/advisor/chat > /tmp/whv-advisor.json
          python3 - <<'PY'
          import json
          answer = json.load(open('/tmp/whv-advisor.json'))
          assert answer['dataPoints'] == 0, answer
          assert answer['sourcesUsed'] == [], answer
          print('Advisor correctly reports missing observations without simulated sources')
          PY
          echo "Analytics snapshot (may initially have no observations):"
          curl -fsS -o /tmp/whv-snapshot.json -w "HTTP %{http_code}\n" --max-time 25             http://localhost:8080/api/product/countries/FRA/economic-snapshot
          head -c 600 /tmp/whv-snapshot.json
      - name: Services and diagnostics
        if: always()
        run: |
          docker compose -f worldhealth-vision-v2/infra/docker-compose.yml ps || true
          docker compose -f worldhealth-vision-v2/infra/docker-compose.yml logs --no-color --tail 90             gateway-service catalog-service timeseries-service analytics-service whv-timescaledb || true
      - name: Tear down ephemeral test infrastructure
        if: always()
        run: docker compose -f worldhealth-vision-v2/infra/docker-compose.yml down -v --remove-orphans || true

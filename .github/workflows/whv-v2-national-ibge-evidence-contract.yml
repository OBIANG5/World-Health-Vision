name: World-Vision DATA-1A — national IBGE Bronze evidence (no live publishing)

on:
  push:
    branches:
      - 'data/v2-national-source-ibge-bronze-contract-*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: whv-data-ibge-${{ github.ref }}
  cancel-in-progress: true

# This CI runs only synthetic official-SHAPED mocks, not actual statistics.
# Never create a public API deployment or a Timeseries write in this workflow.
jobs:
  national-source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Python 3.12 with isolated pip cache
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: worldhealth-vision-v2/services/ingestion-service/pyproject.toml

      - name: Validate explicit no-public-route national-data contract
        run: |
          python - <<'PY'
          from pathlib import Path
          root = Path('worldhealth-vision-v2/services/ingestion-service/src/ingestion_service')
          api = (root/'api.py').read_text(encoding='utf-8')
          pipeline = (root/'pipelines/ibge_national_census.py').read_text(encoding='utf-8')
          assert '/runs/ibge' not in api
          assert 'TimeseriesClient' not in pipeline
          assert 'BRONZE_ONLY_UNREVIEWED' in pipeline
          assert 'REVIEW_REQUIRED' in pipeline
          print('PASS: national research capture has no public route, no Timeseries write')
          PY

      - name: Install ingestion dependencies and test suite
        working-directory: worldhealth-vision-v2/services/ingestion-service
        run: |
          python -m pip install --disable-pip-version-check -e '.[dev]'
          python -m compileall -q src/ingestion_service
          python -m pytest -q tests/test_ibge_national_census.py
          python -m ingestion_service.cli --help

      - name: Run baseline source-ingestion unit regression suite
        working-directory: worldhealth-vision-v2/services/ingestion-service
        run: |
          python -m pytest -q tests --ignore=tests/test_worldbank_live_scope.py

      - name: Mark non-production fixture explicitly
        run: |
          echo 'PASS: IBGE API schema validated against 100% synthetic mocks.'
          echo 'NO authenticated live IBGE call, NO verified runtime ingestion,'
          echo 'NO approval of redistribution rights, NO Atlas/Timeseries publication.'

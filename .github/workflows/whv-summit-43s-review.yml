name: World-Vision 001 — 43-second voiced and subtitled full review

on:
  workflow_dispatch:
  push:
    branches: [feature/world-vision-media-studio]
    paths:
      - 'worldhealth-vision-v2/services/media-renderer/scripts/worldvision_assemble_preview.py'
      - 'worldhealth-vision-v2/services/media-renderer/scripts/worldvision_captions_from_voice.py'
      - '.github/workflows/whv-summit-43s-review.yml'

permissions:
  contents: write

concurrency:
  group: wv-43s-voice-review
  cancel-in-progress: true

jobs:
  full-review:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Checkout source-controlled approved editorial documentary
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install actual FFmpeg with ASS/libass subtitles
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y ffmpeg fontconfig
          fi
          ffmpeg -hide_banner -filters | grep -E ' ass .*Render ASS subtitles'
      - name: Install immutable Manrope used for professional narration subtitles
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/share/fonts"
          FONT="$HOME/.local/share/fonts/Manrope.ttf"
          curl -fL --retry 5 --retry-all-errors --max-time 120 \
            'https://raw.githubusercontent.com/google/fonts/29b4ec6df2522a8aee279414b78a07910b065874/ofl/manrope/Manrope%5Bwght%5D.ttf' -o "$FONT"
          echo '3ae11c49db0455a3cc33e37d380f20fdb8c7f8b41dc07625c177e3d87a9d6ae6  '"$FONT" | sha256sum --check --
          fc-cache -f "$HOME/.local/share/fonts"
          fc-match Manrope
      - name: Verify code syntax and perform exact 1290-frame voiced montage
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            worldhealth-vision-v2/services/media-renderer/scripts/worldvision_assemble_preview.py \
            worldhealth-vision-v2/services/media-renderer/scripts/worldvision_captions_from_voice.py
          python worldhealth-vision-v2/services/media-renderer/scripts/worldvision_assemble_preview.py
      - name: Publish actual 43-second watchable MP4 and synchronized captions
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 --branch whv-media-studio-browser-preview \
            "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" /tmp/wv-43-publish
          SRC=worldhealth-vision-v2/services/media-renderer/output/summit-2026/assembled-review
          OUT=/tmp/wv-43-publish/media-lab/summit-2026/full-review
          mkdir -p "$OUT/review-frames"
          cp "$SRC/worldvision-001-43s-voiced-subtitled-review.mp4" "$OUT/"
          cp "$SRC/worldvision-001-43s-voiced-subtitled-review.json" "$OUT/"
          cp "$SRC/captions.ass" "$SRC/captions.srt" "$SRC/captions.json" "$OUT/"
          cp "$SRC/review-frames/"*.jpg "$OUT/review-frames/"
          cd /tmp/wv-43-publish
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add media-lab/summit-2026/full-review
          if ! git diff --cached --quiet; then
            git commit -m "review(worldvision): source-hashed 43s narrated subtitled film, D00 original not yet accessible"
            git push origin HEAD:whv-media-studio-browser-preview
          fi
          echo "Watch 43s: https://raw.githack.com/$GITHUB_REPOSITORY/whv-media-studio-browser-preview/media-lab/summit-2026/full-review/worldvision-001-43s-voiced-subtitled-review.mp4"

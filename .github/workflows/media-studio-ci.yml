name: World-Vision Media Studio CI

on:
  pull_request:
    branches:
      - v2
    paths:
      - "worldhealth-vision-v2/frontend/web-v2/**"
      - "worldhealth-vision-v2/services/media-service/**"
      - "worldhealth-vision-v2/services/media-renderer/**"
      - "worldhealth-vision-v2/services/gateway-service/**"
      - "worldhealth-vision-v2/infra/**"
      - "worldhealth-vision-v2/docs/media/**"
      - ".github/workflows/media-studio-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  media-service:
    name: Media service tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worldhealth-vision-v2/services/media-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install media service
        run: pip install -e '.[dev]'
      - name: Compile media service
        run: python -m compileall -q src
      - name: Run media unit and API tests
        run: pytest -q --ignore=tests/test_persistence_postgres.py

  media-postgres:
    name: PostgreSQL newsroom integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: whv
          POSTGRES_USER: whv_user
          POSTGRES_PASSWORD: whv_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U whv_user -d whv"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      WHV_TEST_MEDIA_DATABASE_URL: postgresql://whv_user:whv_password@127.0.0.1:5432/whv
    defaults:
      run:
        working-directory: worldhealth-vision-v2/services/media-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]'
      - run: pytest -q tests/test_persistence_postgres.py

  media-renderer:
    name: Remotion renderer checks
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      WHV_RENDER_TEST_REDIS_URL: redis://127.0.0.1:6379/15
    defaults:
      run:
        working-directory: worldhealth-vision-v2/services/media-renderer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install exact renderer dependencies
        run: npm install --no-audit --no-fund
      - name: Test persistent renderer store
        run: npm run test-store
      - name: Typecheck Remotion composition
        run: npm run typecheck
      - name: Check render server syntax
        run: npm run check-server

  frontend:
    name: Canonical V2 frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worldhealth-vision-v2/frontend/web-v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: worldhealth-vision-v2/frontend/web-v2/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Upload frontend dist
        uses: actions/upload-artifact@v4
        with:
          name: world-vision-web-v2-dist
          path: worldhealth-vision-v2/frontend/web-v2/dist
          if-no-files-found: error
          retention-days: 7

  gateway:
    name: Gateway tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worldhealth-vision-v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: worldhealth-vision-v2/pom.xml
      - run: chmod +x mvnw
      - run: ./mvnw -B -ntp -pl services/gateway-service -am test

  compose:
    name: Docker Compose validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worldhealth-vision-v2
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f infra/docker-compose.yml config --quiet

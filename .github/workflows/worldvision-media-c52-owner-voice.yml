name: World-Vision MEDIA P0.7 — selected Vivienne C5.2 owner-review gate (NO VIDEO)
on:
  push:
    branches:
      - 'feature/worldvision-media-vivienne-c52-owner-review-lock-*'
    paths:
      - 'worldhealth-vision-v2/services/media-renderer/creative/owner-review-voice-gate.mjs'
      - 'worldhealth-vision-v2/services/media-renderer/creative/owner-review-voice-gate.test.mjs'
      - 'worldhealth-vision-v2/services/media-renderer/creative/render-project.mjs'
      - '.github/workflows/worldvision-media-c52-owner-voice.yml'
  pull_request:
    paths:
      - 'worldhealth-vision-v2/services/media-renderer/creative/owner-review-voice-gate.mjs'
      - 'worldhealth-vision-v2/services/media-renderer/creative/owner-review-voice-gate.test.mjs'
      - 'worldhealth-vision-v2/services/media-renderer/creative/render-project.mjs'
      - '.github/workflows/worldvision-media-c52-owner-voice.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: worldvision-media-p07-one-test-run
  cancel-in-progress: true
jobs:
  gate-without-voice-or-film:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: worldhealth-vision-v2/services/media-renderer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install existing renderer dependencies (no voice generation)
        run: npm install --no-audit --no-fund
      - name: Syntax and provenance checks for C5.2 and editorial-project rules
        run: |
          node --check creative/owner-review-voice-gate.mjs
          node --check creative/render-project.mjs
          node --test creative/owner-review-voice-gate.test.mjs creative/validate-project.test.mjs
      - name: Type-check unchanged Remotion composition without any video
        run: npm run typecheck
      - name: Confirm no new audiovisual outputs were generated by this job
        run: |
          if test -d output; then
            find output -type f \( -iname '*.mp4' -o -iname '*.mp3' -o -iname '*.wav' \) -print -quit | grep . && exit 1
          fi
          echo 'PASS: C5.2 selection verified by Node tests; no audio or film generated'

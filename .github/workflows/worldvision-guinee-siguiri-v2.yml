name: World-Vision — Guinée Siguiri V2 / one-take Vivienne / owner's blue endcard

on:
  workflow_dispatch:
  push:
    branches:
      - feature/worldvision-guinee-siguiri-v2-voice-endcard-2026-11-14
    paths:
      - '.github/workflows/worldvision-guinee-siguiri-v2.yml'
      - 'worldhealth-vision-v2/services/media-renderer/scripts/worldvision_guinee_siguiri_v2.py'
      - 'worldhealth-vision-v2/docs/media/episodes/2026-11-14_guinee_siguiri/SCRIPT_LOCK_V1.json'
permissions:
  contents: write
concurrency:
  group: worldvision-guinea-balato-v2
  cancel-in-progress: true
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout video engine and locked text
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install FFmpeg and image/audio render dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libsndfile1
          python -m pip install --quiet 'pillow==12.0.0' 'numpy==2.2.6' 'opencv-python-headless==4.12.0.88' 'soundfile>=0.12' 'edge-tts>=7.0,<8.0'
          python - <<'PY'
          import numpy,cv2,PIL,edge_tts,soundfile
          print('RUNTIME OK',numpy.__version__,cv2.__version__)
          PY
      - name: Check exact user-selected script hash before anything else
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,hashlib
          p='worldhealth-vision-v2/docs/media/episodes/2026-11-14_guinee_siguiri/SCRIPT_LOCK_V1.json'
          t=json.load(open(p,encoding='utf8'))
          assert t['status']=='USER_SELECTED_LOCKED_VERBATIM'
          assert len(t['script_lines'])==10
          h=hashlib.sha256('\n'.join(t['script_lines']).encode()).hexdigest()
          assert h=='0d0e268a9f189b9ae4b1714e89dbd67872444340ebce9c64260ee3f440cde8ac'
          assert h==t['sha256_utf8_joined_with_lf']
          print('SCRIPT LOCK VERIFIED',h)
          PY
      - name: Download real NASA Earth, Guinea boundaries, and properly licensed stills
        shell: bash
        run: |
          set -euo pipefail
          D=worldhealth-vision-v2/services/media-renderer/assets/guinee-siguiri-2026-11-14
          mkdir -p "$D"
          UA='World-Vision Editorial 1.0 (https://github.com/OBIANG5/World-Health-Vision)'
          curl -fLsS --retry 5 --retry-all-errors --max-time 180 \
            'https://assets.science.nasa.gov/content/dam/science/esd/eo/images/bmng/bmng-topography/july/world.topo.200407.3x5400x2700.jpg' -o "$D/nasa-earth-5400.jpg"
          curl -fLsS --retry 5 --retry-all-errors --max-time 150 \
            'https://raw.githubusercontent.com/datasets/geo-countries/master/data/countries.geojson' -o "$D/countries.geojson"
          curl -fLsS --retry 5 --retry-all-errors --max-time 100 -A "$UA" \
            'https://commons.wikimedia.org/wiki/Special:Redirect/file/Guinea_Siguiri_miner_woman.jpg' \
            -o "$D/woman_siguiri_usaid.jpg"
          curl -fLsS --retry 5 --retry-all-errors --max-time 100 -A "$UA" \
            'https://commons.wikimedia.org/wiki/Special:Redirect/file/Guinea_Siguiri_village.jpg' \
            -o "$D/siguiri_village_usaid.jpg"
          curl -fLsS --retry 5 --retry-all-errors --max-time 120 \
            'https://images.pexels.com/photos/31570538/pexels-photo-31570538.jpeg?auto=compress&cs=tinysrgb&w=2600' \
            -o "$D/red_soil_illustration.jpg"
          curl -fLsS --retry 5 --retry-all-errors --max-time 120 \
            'https://images.pexels.com/photos/17165570/pexels-photo-17165570.jpeg?auto=compress&cs=tinysrgb&w=2600' \
            -o "$D/river_illustration.jpg"
          # Genuine live-action stock video for livelihood beat, NOT footage
          # from the Balato 2026 clashes; source and author recorded in manifest.
          curl -fLsS --retry 5 --retry-all-errors --max-time 300             'https://videos.pexels.com/video-files/28657918/12445295_3840_2160_24fps.mp4'             -o "$D/real_worker_illustration.mp4"
          curl -fLsS --retry 5 --retry-all-errors --max-time 240             'https://videos.pexels.com/video-files/40458553/17288330_1920_1080_30fps.mp4'             -o "$D/gold_panning_illustration.mp4"
          test "$(stat -c%s "$D/gold_panning_illustration.mp4")" -gt 100000
          ffprobe -v error -show_entries stream=codec_type,width,height -show_entries format=duration -of json "$D/gold_panning_illustration.mp4"
          test "$(stat -c%s "$D/real_worker_illustration.mp4")" -gt 1000000
          ffprobe -v error -show_entries stream=codec_type,width,height -show_entries format=duration -of json "$D/real_worker_illustration.mp4"
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          import json
          d=Path('worldhealth-vision-v2/services/media-renderer/assets/guinee-siguiri-2026-11-14')
          assert Image.open(d/'nasa-earth-5400.jpg').size==(5400,2700)
          f=json.loads((d/'countries.geojson').read_text())['features']
          assert len(f)>180
          assert any((x.get('properties') or {}).get('ISO3166-1-Alpha-3')=='GIN' for x in f)
          for n in ['woman_siguiri_usaid.jpg','siguiri_village_usaid.jpg','red_soil_illustration.jpg','river_illustration.jpg']:
            with Image.open(d/n) as im:
              print(n,im.size,im.format)
              assert im.width>=430 and im.height>=275
              if 'illustration' in n:assert im.width>=1200 and im.height>=800
          PY
          test "$(git hash-object worldhealth-vision-v2/services/media-renderer/public/brand/world-vision-official.png)" = 'bc80fa70cebd566768bfb1703a0f1f636a78c196'
      - name: Download new OFL Space Grotesk + DM Sans font pair
        shell: bash
        run: |
          set -euo pipefail
          D=worldhealth-vision-v2/services/media-renderer/assets/guinee-siguiri-2026-11-14
          curl -fLsS --retry 5 --retry-all-errors --max-time 100 \
            'https://raw.githubusercontent.com/google/fonts/main/ofl/spacegrotesk/SpaceGrotesk%5Bwght%5D.ttf' \
            -o "$D/SpaceGrotesk-variable.ttf"
          curl -fLsS --retry 5 --retry-all-errors --max-time 100 \
            'https://raw.githubusercontent.com/google/fonts/main/ofl/dmsans/DMSans%5Bopsz%2Cwght%5D.ttf' \
            -o "$D/DMSans-variable.ttf"
          python - <<'PY'
          from PIL import ImageFont
          from pathlib import Path
          d=Path('worldhealth-vision-v2/services/media-renderer/assets/guinee-siguiri-2026-11-14')
          for n in ['SpaceGrotesk-variable.ttf','DMSans-variable.ttf']:
            print(n,ImageFont.truetype(str(d/n),48).get_variation_axes())
          PY
      - name: Restore owner-provided blue signature source for three-second endcard
        shell: bash
        run: |
          set -euo pipefail
          D=worldhealth-vision-v2/services/media-renderer/assets/guinee-siguiri-2026-11-14
          SRC="$D/owner_blue_signature.mp4"
          PERMANENT='https://raw.githubusercontent.com/OBIANG5/World-Health-Vision/whv-media-studio-browser-preview/media-lab/guinee-siguiri-v2-2026-11-14/owner_blue_signature.mp4'
          if curl -fLsS --retry 2 --max-time 100 "$PERMANENT" -o "$SRC"; then
            echo 'Previously persisted owner-branded outro recovered.'
          else
            # First run only: create the motion-card from a frame of the exact
            # owner-uploaded 3s video (Canva asset VAHa58Do0Cc).
            curl -fLsS --retry 3 --max-time 130 'https://media.canva.com/v2/files/uri:ifs%3A%2F%2FV%2FMsyGuqGpfjKuTYz7TOYzfHZV4jvnt6DjMjLUcTGWdgg.jpg?csig=AAAAAAAAAAAAAAAAAAAAAKvnEuAqta6hmDqzTTYF3pPDxqofxmk7RBzl_sDMZEbl&exp=1794678600&signer=video-rpc&token=AAIAAVYAL01zeUd1cUdwZmpLdVRZejdUT1l6ZkhaVjRqdm50NkRqTWpMVWNUR1dkZ2cuanBnAAAAAAGh2y4xQPnEaAGPiGiRMc1xITAWTbPmQ-MxCd8BN7g_17LNyIRt' -o "$D/owner_signature_frame.jpg"
            python - <<'PY'
          from PIL import Image
          p='worldhealth-vision-v2/services/media-renderer/assets/guinee-siguiri-2026-11-14/owner_signature_frame.jpg'
          with Image.open(p) as im:
              assert im.width>=450 and im.height>=800
              print('Owner-provided World-Vision logo frame source:',im.size)
          PY
            ffmpeg -y -v error -loop 1 -framerate 30 -i "$D/owner_signature_frame.jpg" \
              -vf "scale=1080:1920:flags=lanczos,format=yuv420p" -t 3.0 -r 30 \
              -c:v libx264 -preset fast -crf 18 -pix_fmt yuv420p -movflags +faststart "$SRC"
          fi
          test -s "$SRC"
          ffprobe -v error -show_entries format=duration -of default=nw=1 "$SRC"
          python - <<'PY'
          import json,subprocess
          p='worldhealth-vision-v2/services/media-renderer/assets/guinee-siguiri-2026-11-14/owner_blue_signature.mp4'
          x=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_format','-of','json',p]))
          assert abs(float(x['format']['duration'])-3)<0.1
          PY
      - name: Produce real 9:16 report with geography, documentary stills and expressive pauses
        shell: bash
        working-directory: worldhealth-vision-v2/services/media-renderer
        run: |
          set -euo pipefail
          python -m py_compile scripts/worldvision_guinee_siguiri_v2.py
          python scripts/guard_on_screen_copy.py scripts/worldvision_guinee_siguiri_v2.py
          python scripts/worldvision_guinee_siguiri_v2.py \
            --texture assets/guinee-siguiri-2026-11-14/nasa-earth-5400.jpg \
            --geojson assets/guinee-siguiri-2026-11-14/countries.geojson \
            --headfont assets/guinee-siguiri-2026-11-14/SpaceGrotesk-variable.ttf \
            --bodyfont assets/guinee-siguiri-2026-11-14/DMSans-variable.ttf \
            --logo public/brand/world-vision-official.png \
            --user-endcard assets/guinee-siguiri-2026-11-14/owner_blue_signature.mp4
      - name: "Hard QA — exact script, slow narration, authentic sources, real H264 AAC and contact sheet"
        shell: bash
        run: |
          set -euo pipefail
          D=worldhealth-vision-v2/services/media-renderer/output/guinee-siguiri-v2
          F="$D/world-vision-guinee-siguiri-v2-vivienne-review.mp4"
          test -s "$F"
          ffprobe -v error -show_entries stream=codec_type,codec_name,width,height,r_frame_rate -show_entries format=duration -of json "$F"
          python - <<'PY'
          from pathlib import Path
          import json
          d=Path('worldhealth-vision-v2/services/media-renderer/output/guinee-siguiri-v2')
          m=json.loads((d/'manifest.json').read_text(encoding='utf8'))
          assert m['script_sha256']=='0d0e268a9f189b9ae4b1714e89dbd67872444340ebce9c64260ee3f440cde8ac'
          assert m['voice']=='fr-FR-VivienneMultilingualNeural'
          assert 139<=m['voice_words_per_minute']<=166
          assert 15<=m['duration_seconds']<=60
          assert m['voice_no_time_stretch']
          assert m['one_continuous_voice_take']
          assert m['user_endcard']['canva_asset_id']=='VAHa58Do0Cc'
          assert not m['voice_commercial_license_verified'] and not m['publication_authorized']
          assert len(m['visual_timeline'])==16
          assert (d/'review/contact-sheet.jpg').is_file()
          assert len(list((d/'review').glob('frame-*.jpg')))==12
          assert 'Guinea' in m['geography']['globe']
          print('QA PASS | Script immutable | Slower Vivienne | Actual video | User artistic approval outstanding')
          PY
          # Reusable cross-episode QA: block too-fast narration, long static cards,
          # missing author/source, script drift, or non-existent final video.
          python worldhealth-vision-v2/services/media-renderer/scripts/validate_worldvision_short.py             --manifest "$D/manifest.json"             --video "$F"             --review "$D/review"             --expected-script-sha 0d0e268a9f189b9ae4b1714e89dbd67872444340ebce9c64260ee3f440cde8ac             --max-seconds 60 --min-wpm 105 --max-wpm 168 --max-card-seconds 6.5
      - uses: actions/upload-artifact@v4
        with:
          name: worldvision-guinee-siguiri-v2-editorial-review
          retention-days: 30
          path: |
            worldhealth-vision-v2/services/media-renderer/output/guinee-siguiri-v2/world-vision-guinee-siguiri-v2-vivienne-review.mp4
            worldhealth-vision-v2/services/media-renderer/output/guinee-siguiri-v2/manifest.json
            worldhealth-vision-v2/services/media-renderer/output/guinee-siguiri-v2/review/*.jpg
      - name: Publish candidate to permanent World-Vision iPhone review site
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 --branch whv-media-studio-browser-preview \
            "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" /tmp/wv-guinea-v2
          SRC=worldhealth-vision-v2/services/media-renderer/output/guinee-siguiri-v2
          DEST=/tmp/wv-guinea-v2/media-lab/guinee-siguiri-v2-2026-11-14
          mkdir -p "$DEST/review" "$DEST/voice-auditions"
          cp "$SRC/world-vision-guinee-siguiri-v2-vivienne-review.mp4" "$SRC/manifest.json" "$DEST/"
          cp "$SRC/review/"*.jpg "$DEST/review/"
          cp "$SRC/vivienne-auditions.json" "$DEST/"
          for NAME in A B C; do
            cp "$SRC/vivienne-audition-$NAME.wav" "$DEST/voice-auditions/$NAME.wav"
          done
          cp worldhealth-vision-v2/docs/media/episodes/2026-11-14_guinee_siguiri/VOICE_AUDITIONS_V2.html "$DEST/voice-auditions/index.html"
          cp worldhealth-vision-v2/services/media-renderer/assets/guinee-siguiri-2026-11-14/owner_blue_signature.mp4 "$DEST/owner_blue_signature.mp4"
          cp worldhealth-vision-v2/docs/media/episodes/2026-11-14_guinee_siguiri/VIEWER_V2.html "$DEST/index.html"
          cd /tmp/wv-guinea-v2
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add media-lab/guinee-siguiri-v2-2026-11-14
          if ! git diff --cached --quiet; then
            git commit -m 'preview(media): Guinea Siguiri documentary and slowly narrated Vivienne, exact script'
            git push origin HEAD:whv-media-studio-browser-preview
          fi

name: World-Vision DATA-1B2A — metadata ingestion and rights review acceptance

on:
  push:
    branches:
      - 'data/v2-ibge-metadata-rights-gates-*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: whv-data1b2a-contract-${{ github.ref }}
  cancel-in-progress: true

# Offline tests use only synthetic metadata, never an IBGE population statistic.
# No credentials, no public endpoint, no output data files, no cloud deployment.
jobs:
  private-metadata-and-rights-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - name: Checkout exact candidate, no retained token
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: worldhealth-vision-v2/services/ingestion-service/pyproject.toml
      - name: Prove no new public routes or publication clients
        run: |
          python - <<'PY'
          from pathlib import Path
          src = Path("worldhealth-vision-v2/services/ingestion-service/src/ingestion_service")
          api = (src / "api.py").read_text(encoding="utf-8")
          pipeline = (src / "pipelines" / "ibge_census_metadata.py").read_text(encoding="utf-8")
          rights = (src / "source_rights_review.py").read_text(encoding="utf-8")
          assert "/runs/ibge" not in api
          assert "TimeseriesClient" not in pipeline
          assert "BRONZE_ONLY_UNREVIEWED" in pipeline
          assert "REVIEW_REQUIRED" in pipeline
          assert "HUMAN_REVIEW_ALONE_DOES_NOT_AUTHORIZE_PRODUCTION_PUBLICATION" in rights
          print("PASS: metadata capture remains private and rights review non-authorizing")
          PY
      - name: Compile and targeted adversarial suites
        working-directory: worldhealth-vision-v2/services/ingestion-service
        run: |
          python -m pip install --disable-pip-version-check -e '.[dev]'
          python -m compileall -q src/ingestion_service
          python -m pytest -q tests/test_ibge_metadata_rights.py tests/test_ibge_national_census.py tests/test_source_evidence_revisions.py
      - name: Existing ingestion regressions, excluding network-only World Bank live test
        working-directory: worldhealth-vision-v2/services/ingestion-service
        run: python -m pytest -q tests --ignore=tests/test_worldbank_live_scope.py
      - name: Private operator CLI and blocked rights evidence
        working-directory: worldhealth-vision-v2/services/ingestion-service
        run: |
          python -m ingestion_service.cli ibge --help
          python -m ingestion_service.cli ibge review-census-2022-rights > /tmp/whv-rights-local.json
          python - <<'PY'
          import json
          r = json.load(open("/tmp/whv-rights-local.json", encoding="utf-8"))
          assert r["review"]["review_status"] == "NEEDS_PROVIDER_CLARIFICATION"
          assert r["commercialDisplayAdvice"]["status"] == "BLOCKED"
          assert r["publicationsEnabled"] is False
          print("PASS: exact IBGE table remains blocked pending proper grant")
          PY
          rm -f /tmp/whv-rights-local.json

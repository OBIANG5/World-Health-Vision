name: World-Vision DATA-1B — official IBGE national endpoint live probe (NO publishing)

on:
  push:
    branches:
      - 'data/v2-national-source-ibge-bronze-contract-*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: whv-ibge-live-probe-${{ github.ref }}
  cancel-in-progress: true

# Real official HTTP request, read-only, strictly one country/one 2022 aggregate.
# No raw data committed, uploaded, reproduced publicly, or sent to Timeseries.
jobs:
  verify-live-official-source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Read exact pilot SHA (no Git auth persisted)
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install only official-client transport dependency
        run: python -m pip install --disable-pip-version-check 'httpx==0.27.2'

      - name: Prove live IBGE national source to ephemeral Bronze without publishing
        env:
          PYTHONPATH: worldhealth-vision-v2/services/ingestion-service/src
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from ingestion_service.bronze_store import BronzeStore
          from ingestion_service.connectors.ibge_national_census_client import (
              IBGE_POPULATION_DATASET, IBGE_POPULATION_INDICATOR,
              IbgeNationalCensusClient,
          )
          from ingestion_service.pipelines.ibge_national_census import IbgeNationalCensusPilot
          with TemporaryDirectory(prefix="whv-ibge-live-ephemeral-") as scratch:
              bronze = BronzeStore(Path(scratch))
              manifest = IbgeNationalCensusPilot(
                  client=IbgeNationalCensusClient(timeout_seconds=25),
                  bronze_store=bronze,
              ).capture_population_2022()
              assert manifest.record_count == 1
              assert manifest.source_code == "IBGE"
              assert manifest.notes["publicationStatus"] == "BRONZE_ONLY_UNREVIEWED"
              assert manifest.notes["timeseriesPublication"] == "NOT_ATTEMPTED"
              assert manifest.notes["licenseReviewStatus"] == "REVIEW_REQUIRED"
              assert manifest.raw_payload_path.is_file()
              assert manifest.normalized_payload_path.is_file()
              observations = [
                  json.loads(line) for line in manifest.normalized_payload_path.read_text().splitlines()
              ]
              assert len(observations) == 1
              assert observations[0]["country_iso3"] == "BRA"
              assert observations[0]["indicator_code"] == IBGE_POPULATION_INDICATOR
              assert observations[0]["period_label"] == "2022"
              assert observations[0]["source_metadata"]["rawSha256"] == manifest.notes["rawSha256"]
              assert observations[0]["value_status"] == "OBSERVED"
              print("LIVE IBGE SOURCE-TO-EPHEMERAL-BRONZE PASS: BRA/N1 census 2022")
              print("Dataset:", IBGE_POPULATION_DATASET, "indicator:", IBGE_POPULATION_INDICATOR)
              print("Canonical JSON payload SHA256:", manifest.notes["rawSha256"])
              print("Raw + normalized + manifest checked in PRIVATE TEMP directory")
              print("No artifact retained or published; rights/revision review pending")
          # TemporaryDirectory cleanup precedes successful exit.
          print("No data retained on CI runner, no Timeseries write, no Atlas publication")
          PY

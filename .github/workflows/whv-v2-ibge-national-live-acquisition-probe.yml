name: World-Vision DATA-1B — official IBGE national endpoint live probe (NO publishing)

on:
  push:
    branches:
      - 'data/v2-national-source-ibge-bronze-contract-*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: whv-ibge-live-probe-${{ github.ref }}
  cancel-in-progress: true

# Real official HTTP request, read-only, strictly one country/one 2022 aggregate.
# No raw data committed, uploaded, reproduced publicly, or sent to Timeseries.
jobs:
  verify-live-official-source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Read exact pilot SHA (no Git auth persisted)
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install only official-client transport dependency
        run: python -m pip install --disable-pip-version-check 'httpx==0.27.2'

      - name: Acquire verified-shape CURRENT IBGE national census response
        env:
          PYTHONPATH: worldhealth-vision-v2/services/ingestion-service/src
        run: |
          python - <<'PY'
          import hashlib
          import httpx
          from ingestion_service.connectors.ibge_national_census_client import (
              IBGE_POPULATION_DATASET, IBGE_POPULATION_INDICATOR,
              IbgeNationalCensusClient,
          )
          client=IbgeNationalCensusClient(timeout_seconds=25)
          # Fail closed. CI result must not pass if official response is missing,
          # malformed or silently substituted by a third-party mirror.
          result=client.fetch_population_2022()
          assert result.source_url.startswith('https://servicodados.ibge.gov.br/api/v3/')
          assert result.source_unit_label.casefold() == 'pessoas'
          assert len(result.raw_sha256) == 64
          print('LIVE OFFICIAL SOURCE CONTACT PASS: IBGE BRA/N1 census 2022')
          print('Dataset:', IBGE_POPULATION_DATASET, 'indicator:', IBGE_POPULATION_INDICATOR)
          print('Canonical JSON payload SHA256:', result.raw_sha256)
          print('Observation value withheld: rights/metadata review is not complete')
          print('No Bronze persistence, no Timeseries write, no publication')
          PY

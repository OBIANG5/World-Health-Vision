name: World-Vision DATA-1B2A — official IBGE metadata shape-only probe

on:
  push:
    branches:
      - 'data/v2-ibge-metadata-rights-gates-*'
    paths:
      - '.github/workflows/whv-v2-ibge-metadata-live-schema.yml'
  workflow_dispatch:

permissions:
  contents: read

# Two bounded, read-only GETs to official IBGE table metadata and periods. No datasets,
# no official numeric observations or raw JSON uploaded, no public interface.
jobs:
  official-metadata-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query IBGE metadata with strict size/content/redirect controls
        run: |
          python - <<'PY'
          import hashlib, json, urllib.request, urllib.error
          url = "https://servicodados.ibge.gov.br/api/v3/agregados/4714/metadados"
          req = urllib.request.Request(
              url, headers={"Accept": "application/json", "Accept-Encoding": "identity",
                            "User-Agent": "World-Vision-DataResearch/1.0"})
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  raise ValueError("Redirect rejected")
          opener = urllib.request.build_opener(NoRedirect)
          with opener.open(req, timeout=20) as response:
              if response.url != url:
                  raise ValueError("Changed official endpoint")
              content_type = response.headers.get("Content-Type", "").lower()
              if "application/json" not in content_type:
                  raise ValueError("Unexpected IBGE content type")
              if response.headers.get("Content-Encoding", "identity").lower() != "identity":
                  raise ValueError("Compressed metadata not allowed")
              raw = response.read(1_000_001)
              if not 1 <= len(raw) <= 1_000_000:
                  raise ValueError("Metadata response exceeds size budget")
          parsed = json.loads(raw.decode("utf-8"))
          if not isinstance(parsed, dict):
              raise ValueError("IBGE metadata top-level must be object")
          # Structural discovery only, no values or table text in log.
          print("OFFICIAL METADATA HTTP 200 and JSON object")
          print("metadata key names:", sorted(parsed.keys()))
          print("aggregate id:", str(parsed.get("id")))
          print("variable records count:", len(parsed.get("variaveis", [])) if isinstance(parsed.get("variaveis"), list) else "not-array")
          print("variable keys:", sorted(parsed["variaveis"][0].keys()) if isinstance(parsed.get("variaveis"), list) and parsed["variaveis"] and isinstance(parsed["variaveis"][0], dict) else "none")
          print("period keys:", sorted(parsed["periodos"][0].keys()) if isinstance(parsed.get("periodos"), list) and parsed["periodos"] and isinstance(parsed["periodos"][0], dict) else "none")
          print("territorial keys:", sorted(parsed["nivelTerritorial"].keys()) if isinstance(parsed.get("nivelTerritorial"), dict) else "none")
          print("exact HTTP entity SHA256:", hashlib.sha256(raw).hexdigest())
          print("Metadata only. NO license approval; NO archive uploaded; NO Timeseries; NO Atlas.")
          PY

      - name: Probe available census periods independently (shape only)
        run: |
          python - <<'PY'
          import hashlib, json, urllib.request
          url = "https://servicodados.ibge.gov.br/api/v3/agregados/4714/periodos"
          req = urllib.request.Request(
              url, headers={"Accept": "application/json", "Accept-Encoding": "identity",
                            "User-Agent": "World-Vision-DataResearch/1.0"})
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  raise ValueError("Redirect rejected")
          with urllib.request.build_opener(NoRedirect).open(req, timeout=20) as resp:
              if resp.url != url or "application/json" not in resp.headers.get("Content-Type", "").lower():
                  raise ValueError("Unexpected period response")
              if resp.headers.get("Content-Encoding", "identity").lower() != "identity":
                  raise ValueError("Unexpected compression")
              raw = resp.read(1_000_001)
              if not 1 <= len(raw) <= 1_000_000:
                  raise ValueError("Period response too large")
          p = json.loads(raw.decode("utf-8"))
          print("period response type:", type(p).__name__)
          print("period item count:", len(p) if isinstance(p, list) else "not-array")
          print("period first item type:", type(p[0]).__name__ if isinstance(p, list) and p else "empty")
          print("period first item keys:", sorted(p[0].keys()) if isinstance(p, list) and p and isinstance(p[0], dict) else "not-object")
          print("period HTTP entity SHA256:", hashlib.sha256(raw).hexdigest())
          print("No dataset values retained or emitted.")
          PY

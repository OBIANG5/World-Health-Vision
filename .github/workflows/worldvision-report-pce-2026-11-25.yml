name: World-Vision — actual PCE editorial film 25 November 2026
on:
  push:
    branches: [feature/worldvision-report-pce-2026-11-25]
    paths:
      - 'worldhealth-vision-v2/services/media-renderer/episodes/pce-2026-11-25/**'
      - '.github/workflows/worldvision-report-pce-2026-11-25.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  owner-review-revised:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    defaults:
      run:
        working-directory: worldhealth-vision-v2/services/media-renderer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Recover exact original source assets, voice and word boundaries from completed V1
        uses: actions/download-artifact@v4
        with:
          name: worldvision-pce-actual-owner-review
          run-id: 45667257921
          github-token: ${{ github.token }}
          path: worldhealth-vision-v2/services/media-renderer
      - name: Install existing rendering dependencies
        run: npm install --no-audit --no-fund
      - name: Refine composition without regenerating the voice or modifying facts
        run: |
          npm run typecheck
          node episodes/pce-2026-11-25/revise.mjs
      - name: Render refined actual World-Vision master
        run: |
          node creative/render-project.mjs --project output/pce-2026-11-25/project.json --assets output/pce-2026-11-25/assets --output output/pce-2026-11-25/world-vision-pce-v2.mp4 --owner-review-voice-manifest output/pce-2026-11-25/voice-manifest.json
          rm -rf output/pce-2026-11-25/world-vision-pce.mp4*
      - name: Save refined master and provenance
        uses: actions/upload-artifact@v4
        with:
          name: worldvision-pce-owner-review-v2
          path: |
            worldhealth-vision-v2/services/media-renderer/output/pce-2026-11-25/
            worldhealth-vision-v2/services/media-renderer/episodes/pce-2026-11-25/SOURCES.md
          if-no-files-found: error
          retention-days: 7

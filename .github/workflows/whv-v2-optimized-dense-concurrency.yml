name: WHV V2 - optimized dense 12-country concurrency and resources

on:
  push:
    branches:
      - 'test/v2-optimized-dense-concurrency-*'
  pull_request:
    branches:
      - 'test/v2-optimized-batches-e2e-resilience-*'
    paths:
      - '.github/workflows/whv-v2-optimized-dense-concurrency.yml'
      - 'worldhealth-vision-v2/infra/tests/benchmark_optimized_dense_concurrency.py'
      - 'worldhealth-vision-v2/infra/tests/sql_profile_*'
      - 'worldhealth-vision-v2/services/analytics-service/**'
      - 'worldhealth-vision-v2/services/timeseries-service/**'
      - 'worldhealth-vision-v2/docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: whv-v2-dense-concurrency-${{ github.ref }}
  cancel-in-progress: true

# CI-only, no exposed API, OIDC provider or external provider requests.
env:
  WHV_TIMESCALE_IMAGE: timescale/timescaledb:2.15.3-pg16
  WHV_OIDC_ISSUER_URI: https://ci-only.invalid/realms/worldvision
  WHV_OIDC_JWKS_URI: https://ci-only.invalid/realms/worldvision/jwks
  WHV_SECURITY_AUDIENCE: worldvision-ci-synthetic-density
  WHV_DB_PASSWORD_FILE: /tmp/whv_ci_optimized_dense_secret
  WHV_GATEWAY_HOST_PORT: "18080"

jobs:
  optimized-dense:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate bounded code and generate exact synthetic fixture
        run: |
          python3 -m py_compile worldhealth-vision-v2/infra/tests/benchmark_optimized_dense_concurrency.py
          python3 -m py_compile worldhealth-vision-v2/infra/tests/report_upstream_metrics.py
          python3 -m py_compile worldhealth-vision-v2/infra/tests/sql_profile_build_fixture.py
          mkdir -p worldhealth-vision-v2/infra/benchmarks/artifacts
          python3 worldhealth-vision-v2/infra/tests/sql_profile_build_fixture.py \
            --profiles worldhealth-vision-v2/services/analytics-service/src/analytics_service/product_profiles.py \
            --template worldhealth-vision-v2/infra/tests/sql_profile_dense_fixture.sql \
            --output worldhealth-vision-v2/infra/benchmarks/artifacts/generated-12-country-fixture.sql \
            --ci-fixture-only

      - name: Prepare disposable credentials and verify absolutely no public ports
        run: |
          openssl rand -hex 40 > "$WHV_DB_PASSWORD_FILE"
          chmod 0644 "$WHV_DB_PASSWORD_FILE"
          docker compose -f worldhealth-vision-v2/infra/compose.secure-staging.yml \
            -f worldhealth-vision-v2/infra/tests/compose.ci-batch-optimized.yml \
            config --format json > "$RUNNER_TEMP/whv-dense-compose.json"
          python3 - "$RUNNER_TEMP/whv-dense-compose.json" <<'PY'
          import json,sys
          services=json.load(open(sys.argv[1]))['services']
          for name in ('whv-timescaledb','catalog-service','timeseries-service','analytics-service'):
              assert not services[name].get('ports'), f'{name} exposed a host port'
          required=(
              'WHV_ANALYTICS_CATALOG_INDICATOR_BATCH_ENABLED',
              'WHV_ANALYTICS_TIMESERIES_LATEST_BATCH_ENABLED',
              'WHV_ANALYTICS_TIMESERIES_AVAILABILITY_BATCH_ENABLED',
              'WHV_ANALYTICS_TIMESERIES_HISTORY_BATCH_ENABLED',
          )
          env=services['analytics-service']['environment']
          assert all(env.get(k)=='true' for k in required)
          print('PASS: isolated DB, four real optimized flags on, no public service ports')
          PY

      - name: Build private Postgres, Catalog, Timeseries and Analytics
        run: |
          docker compose -f worldhealth-vision-v2/infra/compose.secure-staging.yml \
            -f worldhealth-vision-v2/infra/tests/compose.ci-batch-optimized.yml \
            up -d --build --wait whv-timescaledb catalog-service timeseries-service analytics-service

      - name: Seed 124416 correctly labeled synthetic observations only
        run: |
          docker compose -f worldhealth-vision-v2/infra/compose.secure-staging.yml \
            -f worldhealth-vision-v2/infra/tests/compose.ci-batch-optimized.yml \
            exec -T whv-timescaledb sh -ec \
              'test -s /run/secrets/whv_db_password; PGPASSWORD="$(cat /run/secrets/whv_db_password)" exec psql -X -v ON_ERROR_STOP=1 -U whv_user -d whv' \
            < worldhealth-vision-v2/infra/benchmarks/artifacts/generated-12-country-fixture.sql

      - name: Measure 60 real optimized snapshots and sample container CPU/RAM while busy
        run: |
          set -euo pipefail
          compose=(docker compose -f worldhealth-vision-v2/infra/compose.secure-staging.yml \
            -f worldhealth-vision-v2/infra/tests/compose.ci-batch-optimized.yml)
          ids="$("${compose[@]}" ps -q whv-timescaledb catalog-service timeseries-service analytics-service)"
          test -n "$ids"
          "${compose[@]}" exec -T analytics-service python - \
            < worldhealth-vision-v2/infra/tests/benchmark_optimized_dense_concurrency.py \
            > worldhealth-vision-v2/infra/benchmarks/artifacts/optimized-dense-concurrency.json \
            2> worldhealth-vision-v2/infra/benchmarks/artifacts/optimized-dense-concurrency.log &
          bench_pid="$!"
          for n in $(seq 1 12); do
            if ! kill -0 "$bench_pid" 2>/dev/null; then break; fi
            docker stats --no-stream --format '{{json .}}' $ids \
              >> worldhealth-vision-v2/infra/benchmarks/artifacts/optimized-dense-container-stats.jsonl || true
            sleep 1
          done
          wait "$bench_pid"
          python3 -m json.tool worldhealth-vision-v2/infra/benchmarks/artifacts/optimized-dense-concurrency.json >/dev/null
          cat worldhealth-vision-v2/infra/benchmarks/artifacts/optimized-dense-concurrency.log

      - name: Prove no legacy N+1 calls under real concurrent optimized FastAPI
        run: |
          docker compose -f worldhealth-vision-v2/infra/compose.secure-staging.yml \
            -f worldhealth-vision-v2/infra/tests/compose.ci-batch-optimized.yml \
            exec -T analytics-service python -c \
              "import urllib.request; print(urllib.request.urlopen('http://127.0.0.1:8000/metrics',timeout=15).read().decode())" \
            > worldhealth-vision-v2/infra/benchmarks/artifacts/optimized-dense-private-metrics.prom
          python3 worldhealth-vision-v2/infra/tests/report_upstream_metrics.py \
            --input worldhealth-vision-v2/infra/benchmarks/artifacts/optimized-dense-private-metrics.prom \
            --output worldhealth-vision-v2/infra/benchmarks/artifacts/optimized-dense-dependencies.json \
            --require-optimized-economic

      - name: Archive bounded synthetic load, response sizes and resource samples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: whv-v2-optimized-dense-12-country-concurrency
          path: worldhealth-vision-v2/infra/benchmarks/artifacts/
          if-no-files-found: warn
          retention-days: 90

      - name: Destroy all synthetic volumes, containers and one-off secrets
        if: always()
        run: |
          docker compose -f worldhealth-vision-v2/infra/compose.secure-staging.yml \
            -f worldhealth-vision-v2/infra/tests/compose.ci-batch-optimized.yml \
            down -v --remove-orphans || true
          rm -f "$WHV_DB_PASSWORD_FILE"

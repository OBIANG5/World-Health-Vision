name: World-Vision MEDIA — one-time lock sync for shared Remotion

on:
  push:
    branches:
      - 'feature/worldvision-media-kinetic-hook-cues-2026-11-21'
    paths:
      - '.github/workflows/worldvision-media-regenerate-web-lock-once.yml'

permissions:
  contents: write

jobs:
  update-lockfile-with-npm-registry:
    if: github.repository == 'OBIANG5/World-Health-Vision'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact authorized media feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/worldvision-media-kinetic-hook-cues-2026-11-21
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate exact lockfile without executing package scripts
        working-directory: worldhealth-vision-v2/frontend/web-v2
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          node -e "const fs=require('fs');const a=JSON.parse(fs.readFileSync('package.json'));const l=JSON.parse(fs.readFileSync('package-lock.json'));for(const p of ['@remotion/captions','@remotion/google-fonts']){if(a.dependencies[p]!=='4.0.542'||l.packages[''].dependencies[p]!=='4.0.542'||l.packages['node_modules/'+p].version!=='4.0.542')throw Error('Missing locked official Remotion dependency: '+p);}console.log('Verified exact Remotion dependencies and NPM lockfile');"
      - name: Commit only the resulting lockfile back to the existing feature branch
        run: |
          git add -- worldhealth-vision-v2/frontend/web-v2/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already current"
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(media): sync web-v2 lock to official Remotion caption/font packages'
          git push origin 'HEAD:feature/worldvision-media-kinetic-hook-cues-2026-11-21'

name: World-Vision DATA-1B2B — 3 real IBGE GETs, ephemeral journal and receipt

on:
  push:
    branches:
      - 'data/v2-ibge-acquisition-journal-composite-*'
    # Do not contact the external provider for a docs-only commit.
    paths:
      - 'worldhealth-vision-v2/services/ingestion-service/src/ingestion_service/**'
      - 'worldhealth-vision-v2/services/ingestion-service/tests/test_ibge_acquisition_composite.py'
      - '.github/workflows/whv-v2-ibge-acquisition-composite-live-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: data1b2b-live-${{ github.ref }}
  cancel-in-progress: true

# Controlled official fetch: one 2022 national population response, one
# metadata response, one period listing. Do NOT print or upload official
# numeric values, source payloads or local private receipts.
# Never license or publish the material to Timeseries, Gateway or Atlas.
jobs:
  live-private-provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout candidate SHA, no retained credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned compatible research dependencies
        run: python -m pip install --disable-pip-version-check 'httpx==0.27.2' 'pydantic>=2.8,<3'
      - name: Three HTTP evidence acquisitions, real independent event audit and blocked composite
        env:
          PYTHONPATH: worldhealth-vision-v2/services/ingestion-service/src
        run: |
          python - <<'PY'
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from ingestion_service.bronze_store import BronzeStore
          from ingestion_service.connectors.ibge_national_census_client import IbgeNationalCensusClient
          from ingestion_service.connectors.ibge_census_metadata_client import IbgeCensusMetadataClient
          from ingestion_service.pipelines.ibge_national_census import IbgeNationalCensusPilot
          from ingestion_service.pipelines.ibge_census_metadata import IbgeCensusMetadataPilot
          from ingestion_service.acquisition_journal import AcquisitionJournal
          from ingestion_service.source_composite_receipt import IbgeCompositeReceiptStore
          from ingestion_service.source_rights_review import ibge_census_4714_initial_review

          with TemporaryDirectory(prefix='wv-ibge-3get-private-data1b2b-') as folder:
              root = Path(folder)
              store = BronzeStore(root)
              pop = IbgeNationalCensusPilot(
                  client=IbgeNationalCensusClient(timeout_seconds=25),
                  bronze_store=store,
              ).capture_population_2022()
              meta = IbgeCensusMetadataPilot(
                  client=IbgeCensusMetadataClient(timeout_seconds=25),
                  bronze_store=store,
              ).capture_census2022_contract()
              journal = AcquisitionJournal(root)
              datasets = ('CENSO2022_4714', 'CENSO2022_4714_METADATA', 'CENSO2022_4714_PERIODS')
              for dataset in datasets:
                  summary = journal.audit('IBGE', dataset)
                  assert summary['eventCount'] == 1
                  assert summary['successCount'] == 1
                  assert summary['versionCount'] == 1
                  assert summary['failureCount'] == summary['interruptedCount'] == 0
              composite = IbgeCompositeReceiptStore(root)
              evidence = composite.create(
                  population_sha256=pop.notes['httpBodySha256'],
                  metadata_sha256=meta.aggregate_receipt.notes['httpBodySha256'],
                  periods_sha256=meta.periods_receipt.notes['httpBodySha256'],
              )
              checked = composite.verify(evidence['receiptSha256'])
              assert checked['linkedEvidenceCount'] == 3
              assert checked['publicDisplayAuthorised'] is False
              assert ibge_census_4714_initial_review().review_status.value == 'NEEDS_PROVIDER_CLARIFICATION'
              assert not list(root.rglob('timeseries'))
              print('PASS: 3 separate official HTTP source acquisitions, 3 raw versions and successful immutable events.')
              print('PASS: three-way private composite validates, publication and commercial reuse BLOCKED.')
          print('PASS: ephemeral source responses, event journal and composite receipts deleted at workflow end; NO artifacts.')
          PY

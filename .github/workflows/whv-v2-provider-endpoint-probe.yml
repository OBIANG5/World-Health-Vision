name: Diagnostic — official World Bank CPI endpoints (no data fabricated)
on:
  push:
    branches:
      - 'probe/v2-official-inflation-downloads-*'
permissions:
  contents: read
jobs:
  upstream-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Probe documented World Bank API and official CSV export routes
        shell: bash
        run: |
          set -u
          urls=(
            'https://api.worldbank.org/v2/country/FRA/indicator/FP.CPI.TOTL.ZG?format=json&date=2020:2025&per_page=10'
            'https://api.worldbank.org/v2/country/FR/indicator/FP.CPI.TOTL.ZG?format=json&date=2020:2025&per_page=10'
            'https://api.worldbank.org/v2/country/FRA;GAB;USA/indicator/FP.CPI.TOTL.ZG?format=json&date=2020:2025&per_page=40'
            'https://api.worldbank.org/v2/en/indicator/FP.CPI.TOTL.ZG?downloadformat=csv'
            'https://api.worldbank.org/v2/country/FRA/indicator/FP.CPI.TOTL.ZG?downloadformat=csv'
            'https://api.worldbank.org/v2/country?format=json&per_page=5'
            'https://api.worldbank.org/v2/indicator/FP.CPI.TOTL.ZG?format=json'
          )
          for url in "${urls[@]}"; do
            echo "PROBE $url"
            result=$(curl --http1.1 -L -sS --retry 0 -A 'WorldHealthVisionV2-OfficialDataAudit/1.0' \
              --connect-timeout 7 --max-time 26 \
              -o /tmp/wb-probe-output -w 'http=%{http_code} type=%{content_type} bytes=%{size_download} remote=%{remote_ip}' "$url" 2>&1)
            echo "$result"
            if [[ "$result" == *'http=200'* ]]; then
              file /tmp/wb-probe-output || true
              head -c 80 /tmp/wb-probe-output | strings | head -4 || true
            fi
          done
          echo "Network diagnostic only; HTTP 200 != validation of data schema/provenance."
      - name: Inspect official World Bank inflation CSV ZIP schema and ISO3 country coverage
        shell: bash
        run: |
          set -euo pipefail
          curl --http1.1 -fLsS --retry 2 --connect-timeout 10 --max-time 60 \
            'https://api.worldbank.org/v2/en/indicator/FP.CPI.TOTL.ZG?downloadformat=csv' \
            -o /tmp/wb-cpi.zip
          python3 - <<'PY'
          import csv, io, zipfile
          path='/tmp/wb-cpi.zip'
          with zipfile.ZipFile(path) as z:
              files=z.namelist()
              print('ZIP ENTRIES',files)
              target=next(name for name in files if name.endswith('.csv') and name.startswith('API_'))
              rows=list(csv.reader(io.StringIO(z.read(target).decode('utf-8-sig'))))
              print('PREAMBLE',rows[:5])
              header_ix=next(i for i,row in enumerate(rows) if len(row)>10 and 'Country Code' in row)
              header=rows[header_ix]
              print('HEADER LENGTH',len(header),'FIRST',header[:8],'LAST',header[-5:])
              selected=[row for row in rows[header_ix+1:] if len(row)>4 and row[1] in {'FRA','GAB','USA'}]
              for row in selected:
                  nonempty=[(header[i],cell) for i,cell in enumerate(row) if i<len(header) and i>=4 and cell]
                  print('COUNTRY',row[:4],'latest',nonempty[-4:])
              assert len(selected)==3,'Official archive lacks country rows'
          PY
      - name: Probe the revised IMF October 2026 official workbook URL without full download
        shell: bash
        run: |
          set +e
          curl -sSIL --connect-timeout 7 --max-time 26 \
            'https://data.imf.org/-/media/iData/External-Storage/Documents/0FA3DC49A04D446E9D69DBEB29979E1C/en/WEOOct2026all.xlsx' \
            | grep -Ei '^(HTTP/|content-type:|content-length:|location:)' | head -12

name: World-Vision DATA-1C-A2B — original Bronze witness and cross-language evidence

on:
  push:
    branches:
      - 'data/v2-bronze-evidence-attestation-*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: data1c-a2b-${{ github.ref }}
  cancel-in-progress: true

# All inputs synthetic; no third-party HTTP, no credentials, no production
# original source data or real provider commercial grant. Ed25519 keys are
# ephemeral in CI runner RAM and separate for reviewer vs Bronze witness.
jobs:
  postgres-rights-and-independent-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: worldhealth-vision-v2/pom.xml
      - name: Fail-closed receiver/witness and migration contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('worldhealth-vision-v2/services/timeseries-service')
          root=p/'src/main/java/com/worldhealthvision/timeseries'
          v5=(p/'src/main/resources/db/migration/V5__immutable_bronze_witness_provenance.sql').read_text()
          svc=(root/'service/TimeseriesIngestionService.java').read_text()
          proof=(root/'service/EvidenceAttestationVerifier.java').read_text()
          assert 'requireSourceProof' in svc and 'requireCurrentPublicIngestRights' in svc
          assert svc.index('requireSourceProof') < svc.index('requireCurrentPublicIngestRights')
          assert 'initVerify' in proof and 'projection.calculate(request)' in proof
          assert 'evidence_attestation_sha256 is not null' in v5
          assert 'attested_items_sha256 is not null' in v5
          assert 'timeseries.rights_revocation' in v5
          assert 'WHV_EVIDENCE_TRUST_PUBLIC_KEY_BASE64' in (p/'src/main/resources/application.yml').read_text()
          print('PASS: Independent original source witness is required before any public write/read')
          PY
      - name: Maven all Timeseries tests on real Postgres16/Flyway
        working-directory: worldhealth-vision-v2
        run: mvn -B -ntp -pl services/timeseries-service -am test
      - name: No signer private key in main receiver code or resource files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('worldhealth-vision-v2/services/timeseries-service')
          root=p/'src/main'
          all_source='\n'.join(f.read_text() for f in root.rglob('*') if f.is_file())
          assert 'BEGIN PRIVATE KEY' not in all_source
          assert 'initSign(' not in all_source
          assert 'integration-test-only-not-secret' not in all_source
          print('PASS: No private signer or hardcoded shared secret in receiver')
          PY

  python-research-witness-and-ingestion-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 21
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: worldhealth-vision-v2/services/ingestion-service/pyproject.toml
      - name: Install existing ingestion package and test-only crypto dependency
        working-directory: worldhealth-vision-v2/services/ingestion-service
        run: |
          python -m pip install --disable-pip-version-check -e '.[dev]'
          python -m pip install --disable-pip-version-check 'cryptography>=43,<47'
          python -m compileall -q src/ingestion_service
      - name: Private actual-byte witness + item fingerprint + adversarial proof tests
        working-directory: worldhealth-vision-v2/services/ingestion-service
        run: python -m pytest -q tests/test_private_bronze_witness.py
      - name: Ingestion-wide regression including legacy World Bank/IBGE pilots
        working-directory: worldhealth-vision-v2/services/ingestion-service
        run: python -m pytest -q tests --ignore=tests/test_worldbank_live_scope.py

name: World-Vision #001 — full 43s film with French voice and captions

on:
  workflow_dispatch:
  push:
    branches: [feature/world-vision-media-studio]
    paths:
      - 'worldhealth-vision-v2/services/media-renderer/scripts/assemble_worldvision_43s_review.py'
      - 'worldhealth-vision-v2/services/media-renderer/scripts/worldvision_captions_from_voice.py'
      - '.github/workflows/whv-summit-assemble-43s-review.yml'

permissions:
  contents: write

concurrency:
  group: worldvision-43s-full-roughcut
  cancel-in-progress: true

jobs:
  edit:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout verified user-approved script and G0 source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install FFmpeg subtitle support and verify fonts
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y ffmpeg
          fi
          ffmpeg -filters | grep -q ' ass '
          python3 -m py_compile \
            worldhealth-vision-v2/services/media-renderer/scripts/assemble_worldvision_43s_review.py \
            worldhealth-vision-v2/services/media-renderer/scripts/worldvision_captions_from_voice.py
      - name: Generate and verify actual 43s H264 AAC video
        shell: bash
        run: |
          set -euo pipefail
          python3 worldhealth-vision-v2/services/media-renderer/scripts/assemble_worldvision_43s_review.py
      - name: Preserve 43s MP4, thirteen SRT/ASS cues, provenance and nine frame stills
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 --branch whv-media-studio-browser-preview \
            "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" /tmp/wv-43s-reviewed
          SRC=worldhealth-vision-v2/services/media-renderer/output/summit-2026/review-43s
          DST=/tmp/wv-43s-reviewed/media-lab/summit-2026/review-43s
          mkdir -p "$DST/review-frames"
          cp "$SRC/worldvision-001-43s-full-edit-review.mp4" \
            "$SRC/worldvision-001-43s-full-edit-review.json" "$DST/"
          cp "$SRC/captions-word-aligned.srt" \
            "$SRC/captions-word-aligned.ass" \
            "$SRC/captions-word-aligned.json" "$DST/"
          cp "$SRC/review-frames/"*.jpg "$DST/review-frames/"
          cd /tmp/wv-43s-reviewed
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add media-lab/summit-2026/review-43s
          if ! git diff --cached --quiet; then
            git commit -m "review(worldvision): full 43s with French voice and aligned subtitles; S02 authentic video awaiting insertion"
            git push origin HEAD:whv-media-studio-browser-preview
          fi
          echo "iPhone preview: https://raw.githack.com/$GITHUB_REPOSITORY/whv-media-studio-browser-preview/media-lab/summit-2026/review-43s/worldvision-001-43s-full-edit-review.mp4"

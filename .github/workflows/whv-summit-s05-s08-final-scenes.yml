name: World-Vision 001 — S05-S08 last four clean scenes

on:
  workflow_dispatch:
  push:
    branches: [feature/world-vision-media-studio]
    paths:
      - 'worldhealth-vision-v2/services/media-renderer/src/WorldVisionSummit2026.tsx'
      - 'worldhealth-vision-v2/services/media-renderer/render-summit-remaining.mjs'
      - 'worldhealth-vision-v2/services/media-renderer/summit-2026-contract.test.mjs'
      - '.github/workflows/whv-summit-s05-s08-final-scenes.yml'

permissions:
  contents: write

concurrency:
  group: whv-final-scenes-s05-s08
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Checkout exact World-Vision renderer sources
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: worldhealth-vision-v2/services/media-renderer
        run: npm install --no-audit --no-fund
      - name: Download authentic Xi 2024 and Trump 2025 archive photographs
        shell: bash
        run: |
          set -euo pipefail
          ASSETS=worldhealth-vision-v2/services/media-renderer/public/episodes/summit-2026
          mkdir -p "$ASSETS"
          curl -fL --retry 5 --retry-all-errors --max-time 160 \
            'https://commons.wikimedia.org/wiki/Special:Redirect/file/Xi_Jinping_%28November_2024%29_01.jpg' \
            -o "$ASSETS/xi.jpg"
          curl -fL --retry 5 --retry-all-errors --max-time 160 \
            'https://commons.wikimedia.org/wiki/Special:Redirect/file/Official_Presidential_Portrait_of_President_Donald_J._Trump_%282025%29.jpg' \
            -o "$ASSETS/trump.jpg"
          for f in "$ASSETS/xi.jpg" "$ASSETS/trump.jpg"; do
            test "$(file --brief --mime-type "$f")" = 'image/jpeg'
            test "$(stat -c %s "$f")" -gt 50000
          done
          sha256sum "$ASSETS/xi.jpg" "$ASSETS/trump.jpg"
      - name: Install immutable verified Manrope source, preserve original G0
        shell: bash
        run: |
          set -euo pipefail
          FONT=worldhealth-vision-v2/services/media-renderer/public/fonts/Manrope-variable.ttf
          mkdir -p "$(dirname "$FONT")"
          curl -fL --retry 5 --retry-all-errors --max-time 120 \
            'https://raw.githubusercontent.com/google/fonts/29b4ec6df2522a8aee279414b78a07910b065874/ofl/manrope/Manrope%5Bwght%5D.ttf' \
            -o "$FONT"
          echo '3ae11c49db0455a3cc33e37d380f20fdb8c7f8b41dc07625c177e3d87a9d6ae6  '"$FONT" | sha256sum --check --
          G0=worldhealth-vision-v2/services/media-renderer/public/brand/world-vision-official.png
          test "$(git hash-object "$G0")" = "bc80fa70cebd566768bfb1703a0f1f636a78c196"
      - name: Validate editorial script, component, TypeScript and no pre-voice subtitles
        working-directory: worldhealth-vision-v2/services/media-renderer
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck
          node --test summit-2026-contract.test.mjs
          node --check render-summit-remaining.mjs
      - name: Render 4 scene files from the same Remotion camera and brand system
        working-directory: worldhealth-vision-v2/services/media-renderer
        shell: bash
        env:
          REMOTION_DISABLE_UPDATE_CHECK: '1'
        run: |
          set -euo pipefail
          node render-summit-remaining.mjs S05 S06 S07 S08
      - name: Inspect technical metadata, frame differences and real preview stills
        working-directory: worldhealth-vision-v2/services/media-renderer
        shell: bash
        run: |
          set -euo pipefail
          SRC=output/summit-2026
          mkdir -p "$SRC/review-last4"
          for rec in \
            'S05:segment05-china-xi-6p2s.mp4:1.0:3.1:5.8' \
            'S06:segment06-iran-ukraine-7p2s.mp4:1.0:3.6:6.7' \
            'S07:segment07-no-agreement-6p2s.mp4:1.0:3.1:5.8' \
            'S08:segment08-worldvision-outro-3p0s.mp4:0.4:1.5:2.7'; do
            IFS=':' read -r ID F A B C <<< "$rec"
            ffmpeg -y -v error -ss "$A" -i "$SRC/$F" -frames:v 1 -vf scale=540:960 -q:v 3 "$SRC/review-last4/$ID-a.jpg"
            ffmpeg -y -v error -ss "$B" -i "$SRC/$F" -frames:v 1 -vf scale=540:960 -q:v 3 "$SRC/review-last4/$ID-b.jpg"
            ffmpeg -y -v error -ss "$C" -i "$SRC/$F" -frames:v 1 -vf scale=540:960 -q:v 3 "$SRC/review-last4/$ID-c.jpg"
            ffmpeg -y -v error -i "$SRC/review-last4/$ID-a.jpg" -i "$SRC/review-last4/$ID-b.jpg" \
              -i "$SRC/review-last4/$ID-c.jpg" -filter_complex hstack=inputs=3 \
              -q:v 3 "$SRC/review-last4/$ID-contact-sheet.jpg"
          done
          python3 - <<'PY'
          import json,hashlib
          from pathlib import Path
          P=Path('output/summit-2026')
          expected={'S05':186,'S06':216,'S07':186,'S08':90}
          for j in P.glob('segment0[5-8]*.json'):
              d=json.loads(j.read_text())
              assert d['frames']==expected[d['id']]
              assert d['clean_plate'] and not d['voice'] and not d['subtitles']
              photos=list((P/'review-last4').glob(d['id']+'-?.jpg'))
              assert len(photos)==3
              assert len(set(hashlib.sha256(x.read_bytes()).digest() for x in photos))>=2
              print('QA VERIFIED',d['id'],d['frames'],d['sha256'])
          PY
      - name: Archive four MP4 files, QA stills and provenance as permanent GitHub artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 --branch whv-media-studio-browser-preview \
            "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" /tmp/wv-last4
          SRC=worldhealth-vision-v2/services/media-renderer/output/summit-2026
          DST=/tmp/wv-last4/media-lab/summit-2026
          mkdir -p "$DST/review-last4"
          cp "$SRC"/segment05-china-xi-6p2s.* "$DST/"
          cp "$SRC"/segment06-iran-ukraine-7p2s.* "$DST/"
          cp "$SRC"/segment07-no-agreement-6p2s.* "$DST/"
          cp "$SRC"/segment08-worldvision-outro-3p0s.* "$DST/"
          cp "$SRC/review-last4/"*.jpg "$DST/review-last4/"
          cd /tmp/wv-last4
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add media-lab/summit-2026
          if ! git diff --cached --quiet; then
            git commit -m "preview(media): S05-S08 genuine stills and G0 with QA, retain old versions"
            git push origin HEAD:whv-media-studio-browser-preview
          fi
          echo "S05: https://raw.githack.com/$GITHUB_REPOSITORY/whv-media-studio-browser-preview/media-lab/summit-2026/segment05-china-xi-6p2s.mp4"

name: World-Vision Media Studio Browser Preview

on:
  push:
    branches:
      - feature/world-vision-media-studio
    paths:
      - "worldhealth-vision-v2/frontend/web-v2/**"
      - ".github/workflows/media-studio-browser-preview.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: world-vision-media-browser-preview
  cancel-in-progress: true

jobs:
  publish-preview:
    name: Build and publish phone preview
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Media Studio source
        uses: actions/checkout@v4
        with:
          ref: feature/world-vision-media-studio
          path: source
          persist-credentials: false

      - name: Checkout browser preview branch
        uses: actions/checkout@v4
        with:
          ref: whv-v2-browser-preview
          path: preview
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: source/worldhealth-vision-v2/frontend/web-v2/package-lock.json

      - name: Build canonical V2 frontend
        working-directory: source/worldhealth-vision-v2/frontend/web-v2
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Replace compiled preview assets
        run: |
          set -euo pipefail
          rm -rf preview/assets
          cp -R source/worldhealth-vision-v2/frontend/web-v2/dist/assets preview/assets
          cp source/worldhealth-vision-v2/frontend/web-v2/dist/favicon.svg preview/favicon.svg
          cp source/worldhealth-vision-v2/frontend/web-v2/dist/icons.svg preview/icons.svg
          cp source/worldhealth-vision-v2/frontend/web-v2/dist/countries.geojson preview/countries.geojson
          cp source/worldhealth-vision-v2/frontend/web-v2/dist/index.html preview/index.html

      - name: Adapt Vite build for immutable static hosting
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("preview/index.html")
          html = path.read_text(encoding="utf-8")

          html = html.replace('src="/assets/', 'src="./assets/')
          html = html.replace('href="/assets/', 'href="./assets/')
          html = html.replace('href="/favicon.svg"', 'href="./favicon.svg"')

          preview_head = """    <meta name="robots" content="noindex,nofollow" />
              <script src="./preview-countries.js"></script>
              <script src="./preview-sources.js"></script>
              <script src="./preview-local-catalog.js"></script>
              <script src="./preview-bootstrap.js"></script>
          """

          if "preview-bootstrap.js" not in html:
              html = html.replace(
                  '    <meta charset="UTF-8" />',
                  '    <meta charset="UTF-8" />\n' + preview_head.rstrip(),
              )

          badge = """    <div
                id="wv-static-preview-badge"
                style="position:fixed;left:10px;bottom:10px;z-index:99999;padding:7px 10px;border-radius:999px;background:rgba(5,5,5,.88);border:1px solid rgba(255,255,255,.18);color:#fff;font:700 9px/1.2 Inter,system-ui,sans-serif;letter-spacing:.06em;box-shadow:0 8px 30px rgba(0,0,0,.35)"
              >
                APERÇU STATIQUE · INTERFACE RÉELLE · BACKEND SIMULÉ
              </div>
          """
          if "wv-static-preview-badge" not in html:
              html = html.replace(
                  '    <div id="root"></div>',
                  '    <div id="root"></div>\n' + badge.rstrip(),
              )

          path.write_text(html, encoding="utf-8")
          PY

      - name: Validate preview bundle references
        run: |
          set -euo pipefail
          test -f preview/index.html
          test -f preview/preview-bootstrap.js
          test -f preview/preview-countries.js
          test -f preview/preview-sources.js
          test -f preview/preview-local-catalog.js
          grep -q 'preview-bootstrap.js' preview/index.html
          grep -q 'APERÇU STATIQUE' preview/index.html
          if grep -Eq '(src|href)="/assets/' preview/index.html; then
            echo "Absolute Vite asset path remains in preview index." >&2
            exit 1
          fi
          while IFS= read -r asset; do
            test -f "preview/$asset" || {
              echo "Missing referenced asset: $asset" >&2
              exit 1
            }
          done < <(
            grep -oE '(src|href)="\./[^"]+"' preview/index.html               | sed -E 's/^(src|href)="\.\///; s/"$//'               | grep '^assets/'               | sort -u
          )

      - name: Commit immutable browser preview
        working-directory: preview
        run: |
          set -euo pipefail
          git config user.name "world-vision-preview-bot"
          git config user.email "world-vision-preview-bot@users.noreply.github.com"
          git add index.html assets favicon.svg icons.svg countries.geojson
          if git diff --cached --quiet; then
            echo "Preview already matches the validated frontend build."
            exit 0
          fi
          git commit -m "preview(media): sync validated Media Studio frontend"
          git push origin HEAD:whv-v2-browser-preview

name: World-Vision Editorial V2 — genuine 11.6s opening pilot

on:
  workflow_dispatch:
  push:
    branches: [rebuild/editorial-v2-quality-gates]
    paths:
      - 'worldhealth-vision-v2/services/media-renderer/src/WorldVisionEditorialV2.tsx'
      - 'worldhealth-vision-v2/services/media-renderer/src/EditorialV2Root.tsx'
      - 'worldhealth-vision-v2/services/media-renderer/src/editorial-v2-index.ts'
      - 'worldhealth-vision-v2/services/media-renderer/render-editorial-v2.mjs'
      - 'worldhealth-vision-v2/services/media-renderer/quality/**'
      - 'worldhealth-vision-v2/services/media-renderer/scripts/setup_editorial_v2_assets.sh'
      - '.github/workflows/whv-editorial-v2-pilot.yml'

permissions:
  contents: write

concurrency:
  group: worldvision-editorial-v2-pilot
  cancel-in-progress: true

jobs:
  cinematic:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Exact source checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Node for existing Remotion studio
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Remotion dependencies
        working-directory: worldhealth-vision-v2/services/media-renderer
        run: npm install --no-audit --no-fund
      - name: Install video utilities and pre-render quality gate
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y ffmpeg
          fi
          python3 -m py_compile worldhealth-vision-v2/services/media-renderer/quality/*.py
          python3 worldhealth-vision-v2/services/media-renderer/quality/quality_gate_v2.py --mode source
      - name: Acquire license-identified photos, true NASA globe, pinned fonts and official G0
        shell: bash
        run: bash worldhealth-vision-v2/services/media-renderer/scripts/setup_editorial_v2_assets.sh
      - name: Typecheck and render only first 11.6 seconds at actual 1080x1920
        shell: bash
        working-directory: worldhealth-vision-v2/services/media-renderer
        env:
          REMOTION_DISABLE_UPDATE_CHECK: '1'
        run: |
          set -euo pipefail
          node --check render-editorial-v2.mjs
          npm run typecheck
          node render-editorial-v2.mjs pilot
      - name: Check actual codec and moving frames / no filler brand card
        shell: bash
        working-directory: worldhealth-vision-v2/services/media-renderer
        run: |
          set -euo pipefail
          MP4=output/editorial-v2/opening-pilot-11p6s-v2.mp4
          python3 quality/quality_gate_v2.py --mode pilot --video "$MP4"
          R=output/editorial-v2/review-frames
          mkdir -p "$R"
          for pair in '0.7:leaders-a' '2.8:leaders-b' '4.7:globe-first' '6.6:globe-moving' '9.1:transition' '10.3:shenzhen' '11.3:shenzhen-final'; do
            IFS=: read -r sec name <<< "$pair"
            ffmpeg -y -loglevel error -ss "$sec" -i "$MP4" -frames:v 1 \
              -vf scale=540:960 -q:v 3 "$R/$name.jpg"
          done
          ffmpeg -y -loglevel error -i "$R/leaders-b.jpg" -i "$R/globe-moving.jpg" -i "$R/shenzhen-final.jpg" \
            -filter_complex hstack=inputs=3 -q:v 3 "$R/contact-sheet.jpg"
          python3 - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          p=Path('output/editorial-v2/review-frames')
          names=('leaders-a','leaders-b','globe-first','globe-moving','transition','shenzhen','shenzhen-final')
          h=[sha256((p/(n+'.jpg')).read_bytes()).hexdigest() for n in names]
          assert len(set(h))>=6,'Frozen or duplicated visual frames'
          print('PASS: 7 source-specific time samples, dynamic globe and real city.')
          PY
      - name: Preserve first honest pilot on mobile review branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 --branch whv-media-studio-browser-preview \
            "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" /tmp/wv-editorial-v2
          SRC=worldhealth-vision-v2/services/media-renderer/output/editorial-v2
          DST=/tmp/wv-editorial-v2/media-lab/summit-2026/editorial-v2
          mkdir -p "$DST/review-frames"
          cp "$SRC/opening-pilot-11p6s-v2.mp4" "$SRC/opening-pilot-11p6s-v2.json" "$DST/"
          cp "$SRC/review-frames/"*.jpg "$DST/review-frames/"
          cd /tmp/wv-editorial-v2
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add media-lab/summit-2026/editorial-v2
          if ! git diff --cached --quiet; then
            git commit -m "preview(worldvision): V2 11.6s source-locked editorial pilot, no logo hold"
            pushed=0
            for attempt in 1 2 3 4 5; do
              git fetch origin whv-media-studio-browser-preview
              git rebase origin/whv-media-studio-browser-preview
              if git push origin HEAD:whv-media-studio-browser-preview; then pushed=1; break; fi
              sleep 2
            done
            test "$pushed" = 1
          fi
          echo "View mobile: https://raw.githack.com/$GITHUB_REPOSITORY/whv-media-studio-browser-preview/media-lab/summit-2026/editorial-v2/opening-pilot-11p6s-v2.mp4"

# =============================================================================
# FICHIER : services/timeseries-service/src/main/resources/application.yml
# =============================================================================
#
# A QUOI SERT CE FICHIER ?
# -----------------------------------------------------------------------------
# Ce fichier configure le service proprietaire des observations temporelles
# canoniques de WorldHealth Vision V2.
#
# Il porte :
# - le port du service
# - la connexion a PostgreSQL / TimescaleDB
# - Flyway
# - les endpoints techniques de supervision
# =============================================================================

server:
  port: ${WHV_TIMESERIES_PORT:8083}
  shutdown: graceful

spring:
  application:
    name: timeseries-service

  threads:
    virtual:
      enabled: true

  datasource:
    url: ${WHV_DB_URL:jdbc:postgresql://localhost:5432/whv}
    username: ${WHV_DB_USERNAME:whv_user}
    password: ${WHV_DB_PASSWORD:whv_password}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 3000

  flyway:
    enabled: true
    locations: classpath:db/migration
    table: timeseries_flyway_schema_history
    baseline-on-migrate: true
    baseline-version: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

  endpoint:
    health:
      show-details: always

info:
  app:
    name: timeseries-service
    role: canonical-timeseries
    focus: multi-source-observations

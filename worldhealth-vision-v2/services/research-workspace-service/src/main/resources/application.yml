server:
  port: ${WHV_RESEARCH_PORT:8091}
  shutdown: graceful
  error:
    include-message: never
spring:
  application:
    name: research-workspace-service
  datasource:
    url: ${WHV_RESEARCH_DB_URL:}
    username: ${WHV_RESEARCH_DB_USERNAME:}
    password: ${WHV_RESEARCH_DB_PASSWORD:}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 3000
  flyway:
    enabled: true
    schemas: trading_private
    default-schema: trading_private
    locations: classpath:db/migration
    table: research_flyway_history
    baseline-on-migrate: false
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
whv:
  research:
    security:
      issuer: ${WHV_SECURITY_ISSUER_URI:}
      jwk-set-uri: ${WHV_SECURITY_JWK_SET_URI:}
      audience: ${WHV_SECURITY_AUDIENCE:}
      allow-loopback-test-jwks: ${WHV_SECURITY_ALLOW_INSECURE_LOOPBACK_JWKS_FOR_TESTS:false}

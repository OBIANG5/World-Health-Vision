[project]
name = "whv-analytics-service"
version = "0.1.0"
description = "WorldHealth Vision V2 analytics service."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<0.28",
  "pydantic-settings>=2.6,<3.0",
  "prometheus-client>=0.21,<0.22",
  "tenacity>=9.0,<10.0",
  "uvicorn[standard]>=0.32,<0.33"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0"
]

[tool.pytest.ini_options]
pythonpath = [
  "src"
]
testpaths = [
  "tests"
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

# =============================================================================
# FICHIER : services/catalog-service/src/main/resources/application.yml
# =============================================================================
#
# A QUOI SERT CE FICHIER ?
# -----------------------------------------------------------------------------
# Ce fichier configure le comportement runtime du catalog-service.
#
# Le service demarre avec :
# - une connexion PostgreSQL/Timescale locale
# - des migrations Flyway
# - des endpoints Actuator exposes pour la supervision
#
# RESPONSABILITES DE CE FICHIER
# -----------------------------------------------------------------------------
# - definir le port du service
# - definir la connexion a la base
# - activer les migrations et le monitoring
#
# CE FICHIER N'EST PAS RESPONSABLE DE
# -----------------------------------------------------------------------------
# - definir les tables SQL elles-memes
# - coder les endpoints
# - implementer la logique metier
# =============================================================================

server:
  port: ${WHV_CATALOG_PORT:8082}
  shutdown: graceful

spring:
  application:
    name: catalog-service

  threads:
    virtual:
      enabled: true

  datasource:
    url: ${WHV_DB_URL:jdbc:postgresql://localhost:5432/whv}
    username: ${WHV_DB_USERNAME:whv_user}
    password: ${WHV_DB_PASSWORD:whv_password}
    hikari:
      maximum-pool-size: 8
      minimum-idle: 2
      connection-timeout: 3000

  flyway:
    enabled: true
    locations: classpath:db/migration
    table: catalog_flyway_schema_history
    baseline-on-migrate: true
    baseline-version: 0

  jackson:
    serialization:
      write-dates-as-timestamps: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

  endpoint:
    health:
      show-details: always

info:
  app:
    name: catalog-service
    role: reference-catalog
    focus: countries-indicators-sources-datasets
